  .cmp-wrap{ overflow-x:auto; }

</style>

  // Acerca de
  acercaEyebrow: { es:'Acerca de', en:'About' },
  acercaSub: { es:'Una herramienta de deliberación colectiva asistida por inteligencia artificial, pensada para cualquier grupo humano que necesite pensar y decidir en conjunto.', en:'A tool for collective deliberation assisted by artificial intelligence, designed for any group of people who need to think and decide together.' },
  acercaProblemaTitulo: { es:'¿Qué problema resuelve?', en:'What problem does it solve?' },
  acercaProblemaTexto: { es:'En grupos numerosos, la mayor barrera para deliberar no es la falta de ganas de participar, sino la dificultad concreta de expresarse frente a muchos y de escuchar realmente a todos los demás. Panorama IA usa una IA para conversar en privado con cada persona, y después cruza todas esas conversaciones para devolver un panorama común: qué se repite, dónde hay consenso, dónde hay matices, y qué propuestas surgieron.', en:'In large groups, the biggest barrier to deliberation isn\'t a lack of willingness to participate, but the real difficulty of speaking up in front of many people and truly listening to everyone else. Panorama IA uses an AI to talk privately with each person, then combines all those conversations into a shared picture: what comes up repeatedly, where there\'s consensus, where there are nuances, and what proposals emerged.' },
  acercaIdeaTitulo: { es:'La idea de fondo', en:'The underlying idea' },
  acercaIdeaTexto: { es:'Este enfoque se conoce en el campo de la democracia digital como "deliberación masiva en línea" (Mass Online Deliberation, o MOD), y ya se usa en el mundo con herramientas como Pol.is (usada en el proceso vTaiwan), la Habermas Machine de Google DeepMind, o Talk to the City del AI Objectives Institute. Panorama IA toma esa misma idea y la lleva a un formato conversacional fluido, tipo charla y no formulario, con un panorama que se puede consultar en vivo por cualquiera. Es una pieza más dentro de lo que se conoce como democracia digital o democracia participativa asistida por tecnología: usar herramientas nuevas para ampliar quién puede ser escuchado, no para reemplazar la decisión humana.', en:'This approach is known in the digital democracy field as "Mass Online Deliberation" (MOD), and it\'s already used around the world in tools like Pol.is (used in the vTaiwan process), Google DeepMind\'s Habermas Machine, or the AI Objectives Institute\'s Talk to the City. Panorama IA takes that same idea and brings it into a fluid, conversational format — more like a chat than a form — with a panorama that anyone can check live. It\'s one more piece of what\'s known as digital democracy or technology-assisted participatory democracy: using new tools to widen who gets to be heard, not to replace human decision-making.' },
  acercaHechoTitulo: { es:'Cómo está hecho', en:'How it\'s built' },
  acercaHechoTexto: { es:'Panorama IA fue construido junto con Claude (de Anthropic), que además es el modelo de IA que conversa con cada participante y arma las síntesis. Es una sola página web autocontenida — sin servidores propios ni bases de datos externas — que guarda todo en el almacenamiento del propio espacio donde corre.', en:'Panorama IA was built together with Claude (by Anthropic), which is also the AI model that talks with each participant and builds the summaries. It\'s a single self-contained web page — with no servers or external databases of its own — that stores everything in the storage of the space where it runs.' },
  acercaPretendeTitulo: { es:'Qué pretende ser', en:'What it aims to be' },
  acercaPretendeTexto1: { es:'Panorama IA no busca reemplazar la deliberación humana ni la toma de decisiones de ningún grupo — busca ampliarla. La apuesta de fondo es que la barrera para participar en la vida colectiva no suele ser la falta de interés, sino la falta de tiempo, de comodidad para hablar en público, o de una instancia real donde la propia voz llegue a formar parte de algo más grande. La idea es que cualquier organización —chica o grande, con o sin recursos técnicos— pueda tener acceso a esa misma capacidad de escuchar a todos sus integrantes, sin depender de encuestas rígidas ni de reuniones interminables.', en:'Panorama IA doesn\'t try to replace human deliberation or any group\'s decision-making — it tries to expand it. The underlying bet is that the barrier to participating in collective life usually isn\'t a lack of interest, but a lack of time, comfort speaking in public, or a real venue where one\'s own voice becomes part of something bigger. The idea is that any organization — small or large, with or without technical resources — can have access to that same ability to listen to all of its members, without relying on rigid surveys or endless meetings.' },
  acercaPretendeTexto2: { es:'Es un proyecto en construcción activa, pensado como un piloto abierto: se ajusta y mejora a partir de lo que cada grupo que lo prueba encuentra útil, confuso, o le falta. No pretende tener todas las respuestas de entrada, sino ser una base honesta desde donde seguir mejorando junto con quienes lo usan.', en:'It\'s a project under active development, meant as an open pilot: it gets adjusted and improved based on what each group that tries it finds useful, confusing, or missing. It doesn\'t claim to have all the answers from day one — it aims to be an honest starting point to keep improving together with the people who use it.' },
  acercaEspacioTitulo: { es:'Cada grupo, un espacio propio', en:'Each group, its own space' },
  acercaEspacioTexto: { es:'Cualquier persona puede crear su propio Panorama para su asamblea, cooperativa, consorcio, sindicato, fundación, equipo de trabajo o cualquier otro tipo de organización — con su propio link, su propio moderador y sus propios temas, completamente independiente de cualquier otro grupo que use la misma herramienta.', en:'Anyone can create their own Panorama for their assembly, cooperative, condo association, union, foundation, work team, or any other kind of organization — with its own link, its own moderator, and its own topics, completely independent from any other group using the same tool.' },

function tr(key){
  const entry = I18N[key];

}

function plural(n, esUno, esVarios, enUno, enVarios){
  const palabra = state.lang === 'en' ? (n === 1 ? enUno : enVarios) : (n === 1 ? esUno : esVarios);
  return n + ' ' + palabra;
}

// "N persona(s) votaron[ sufijo]." / "N person voted / people voted[ suffix]."
function personasVotaron(n, sufijoEs, sufijoEn){
  if(state.lang === 'en'){
    return n + ' ' + (n===1 ? 'person voted' : 'people voted') + (sufijoEn ? ' ' + sufijoEn : '') + '.';

  return n + ' persona' + (n===1?'':'s') + ' votaron' + (sufijoEs ? ' ' + sufijoEs : '') + '.';

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function uid(){ return 'p_' + Math.random().toString(36).slice(2,10); }

async function callClaudeFull(messages, system, tools, maxTokens){
  const body = { model:"claude-sonnet-4-6", max_tokens: maxTokens || 1000, system: system, messages: messages };
  if(tools) body.tools = tools;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let detail = '';
    try{ const b = await res.json(); detail = (b && b.error && b.error.message) || JSON.stringify(b); }catch(e){ detail = await res.text().catch(()=> ''); }
    throw new Error("api_error_" + res.status + (detail ? ": " + detail : ""));
  }
  return await res.json();
}

async function callClaude(messages, system, tools, maxTokens){
  const data = await callClaudeFull(messages, system, tools, maxTokens);
  return (data.content || []).map(b => b.text || '').join('');
}

function calcularMaxTokensSintesis(textoLength){
  // Escala el margen de respuesta según cuánto texto hay para leer y sintetizar,
  // para no gastar espacio de más en temas chicos ni quedarse corto en temas grandes.
  if(textoLength < 4000) return 1000;
  if(textoLength < 12000) return 2000;
  if(textoLength < 30000) return 3000;
  return 4000;
}

async function rawStorageGet(key, shared){ try{ return await window.storage.get(key, !!shared); }catch(e){ return null; } }
async function rawStorageSet(key, value, shared){ try{ return await window.storage.set(key, value, !!shared); }catch(e){ return null; } }
async function rawStorageList(prefix, shared){ try{ const r = await window.storage.list(prefix, !!shared); return r ? r.keys : []; }catch(e){ return []; } }
async function rawStorageDelete(key, shared){ try{ await window.storage.delete(key, !!shared); }catch(e){} }

/* Todas las claves de datos de un espacio quedan prefijadas automáticamente con su código,
   así el resto del código (temas, conversaciones, síntesis, perfiles) no necesita saber
   que existen múltiples espacios aislados: solo opera "dentro" del suyo. */
function wsPrefix(){ return 'ws:' + (state.workspaceId || 'default') + ':'; }
async function storageGet(key, shared){ return rawStorageGet(wsPrefix() + key, shared); }
async function storageSet(key, value, shared){ return rawStorageSet(wsPrefix() + key, value, shared); }
async function storageList(prefix, shared){
  const keys = await rawStorageList(wsPrefix() + prefix, shared);
  const p = wsPrefix();
  return keys.map(k => k.startsWith(p) ? k.slice(p.length) : k);
}
async function storageDelete(key, shared){ return rawStorageDelete(wsPrefix() + key, shared); }

async function otroGrupoGet(codigo, key, shared){ return rawStorageGet('ws:' + codigo + ':' + key, shared); }
async function otroGrupoSet(codigo, key, value, shared){ return rawStorageSet('ws:' + codigo + ':' + key, value, shared); }
async function otroGrupoList(codigo, prefix, shared){
  const keys = await rawStorageList('ws:' + codigo + ':' + prefix, shared);
  const p = 'ws:' + codigo + ':';
  return keys.map(k => k.startsWith(p) ? k.slice(p.length) : k);
}

async function listarGruposPublicos(){
  const keys = await rawStorageList('wsmeta:', true);
  const grupos = [];
  for(const k of keys){
    const r = await rawStorageGet(k, true);
    if(!r) continue;
    let meta; try{ meta = JSON.parse(r.value); }catch(e){ continue; }
    if(!meta.publico) continue;
    const codigo = k.slice('wsmeta:'.length);
    const temasR = await otroGrupoGet(codigo, 'config:temas', true);
    const temas = temasR ? JSON.parse(temasR.value) : [];
    let participaciones = 0, ultimaActividad = 0;
    for(const t of temas){
      const claves = await otroGrupoList(codigo, 'conversacion:' + t.id + ':', true);
      participaciones += claves.length;
      if(t.ultimaActividad && t.ultimaActividad > ultimaActividad) ultimaActividad = t.ultimaActividad;
    }
    grupos.push({ codigo, nombre: meta.nombre, creado: meta.creado, cantidadTemas: temas.length, participaciones, ultimaActividad });
  }
  return grupos;
}

async function getTemasFrescos(){
  const r = await storageGet('config:temas', true);
  return r ? JSON.parse(r.value) : [];
}
async function upsertTema(tema){
  const list = await getTemasFrescos();
  const idx = list.findIndex(x => x.id === tema.id);
  if(idx > -1) list[idx] = tema; else list.push(tema);
  await storageSet('config:temas', JSON.stringify(list), true);
  state.temas = list;
}
async function patchTema(id, patchFn){
  const list = await getTemasFrescos();
  const idx = list.findIndex(x => x.id === id);
  if(idx > -1) patchFn(list[idx]);
  await storageSet('config:temas', JSON.stringify(list), true);
  state.temas = list;
  return idx > -1 ? list[idx] : null;
}
async function removeTemaGlobal(id){
  const list = await getTemasFrescos();
  const filtered = list.filter(x => x.id !== id);
  await storageSet('config:temas', JSON.stringify(filtered), true);
  state.temas = filtered;
}

function fechaCorta(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const locale = state.lang === 'en' ? 'en-US' : 'es-AR';
  return d.toLocaleDateString(locale, { day:'2-digit', month:'2-digit', year:'numeric' })
    + ' ' + d.toLocaleTimeString(locale, { hour:'2-digit', minute:'2-digit' });
}

function ordenarTemas(lista, modo){
  const m = modo || 'actividad';
  return lista.slice().sort((a,b) => {
    if(!!a.fijado !== !!b.fijado) return a.fijado ? -1 : 1;
    if(m === 'participantes') return (b._count||0) - (a._count||0);
    if(m === 'creacion') return (b.creado||0) - (a.creado||0);
    return ((b._ultimaActividad || b.creado || 0) - (a._ultimaActividad || a.creado || 0));
  });
}

    const votoR = await storageGet('voto:' + state.temaActual.id + ':' + state.participantId, true);
    state.miVoto = votoR ? JSON.parse(votoR.value) : [];
  } else {
    state.encuestaResultados = null;
    state.miVoto = [];
  }
}

async function resultadosEncuesta(temaId, encuesta){
  const keys = await storageList('voto:' + temaId + ':', true);
  const counts = encuesta.opciones.map(() => 0);
  let totalVotantes = 0;
  for(const k of keys){
    const r = await storageGet(k, true);
    if(!r) continue;
    try{
      const sel = JSON.parse(r.value);
      const arr = Array.isArray(sel) ? sel : [sel];
      if(arr.length) totalVotantes++;
      arr.forEach(i => { if(counts[i] !== undefined) counts[i]++; });
    }catch(e){}
  }
  return { counts, totalVotantes };
}

async function cargarStatsTema(t){
  const keys = await storageList('conversacion:' + t.id + ':', true);
  t._count = keys.length;
  t._ultimaActividad = t.ultimaActividad || 0;
}

const ACERCA_DE_RESUMEN = `Panorama IA es una herramienta de deliberación colectiva asistida por IA. Cualquier persona u organización puede crear su propio grupo ("Panorama"), con su propio link (un código único pegado al final), su propio PIN de moderador/a elegido por quien lo crea, y opcionalmente un PIN de acceso para participantes. Si el creador olvida su PIN, puede recuperarlo desde la misma cuenta de Claude con la que creó el grupo, sin necesidad de códigos extra.

Dentro de un grupo, el moderador crea "temas" (preguntas o cuestiones a deliberar) con un título y una descripción que guía a la IA; puede fijarlos arriba de la lista, pausarlos, terminarlos, editarlos o eliminarlos, y también puede permitir que los participantes propongan temas ellos mismos, con o sin aprobación previa. La lista de temas se puede buscar por texto y ordenar por actividad reciente, fecha de creación o cantidad de participantes.

Cada participante elige su nombre una sola vez por grupo (no se puede repetir con el de otra persona en el mismo grupo) y conversa en privado con una IA sobre cada tema, con sus propias palabras — la IA no opina ni influye, solo ayuda a pensar en voz alta y ordenar ideas. Esa IA puede buscar en la web si se lo piden, y también puede consultar las síntesis de los otros temas del mismo grupo si el participante pregunta si algo ya se habló en otro lado o pide un panorama general del grupo. Responde siempre en el idioma en que le escriban.

Las conversaciones de un tema se cruzan para armar una "síntesis": resumen, consensos, matices/desacuerdos, propuestas (con nombre de quién las dijo, de forma transparente como en una asamblea presencial), y cuando corresponde, un plan de acción con pasos o un cuadro comparativo de posturas opuestas. Cualquier participante puede pedir "ver el panorama del grupo" en medio de su charla para conocer y profundizar sobre lo que dijeron los demás, incluso pidiendo traducciones. Cualquiera (participe o no) puede consultar esa síntesis desde el registro público del tema, sin ser moderador.

Los temas pueden tener una encuesta opcional (una o varias opciones, no rígida: se puede cambiar el voto cuando quieras).

Un grupo puede ser público (aparece en un directorio buscable en la pantalla principal, con buscador y orden, donde cualquiera puede ver un panorama de segundo nivel —una síntesis que cruza las síntesis de todos los temas del grupo— y sumarse) o privado (solo con el link, por defecto).

Las síntesis, tanto de un tema como de un grupo entero, se pueden descargar en Word. Panorama IA es de código abierto (se puede descargar el código completo desde "Acerca de") y fue construido junto con Claude, de Anthropic. La idea de fondo es ampliar la participación democrática y la escucha colectiva, no reemplazarla, evitando el discurso de odio y la desinformación.

Sobre la capacidad técnica: la app usa Claude Sonnet 4.6, que puede leer hasta 1.000.000 de tokens de contexto en una sola síntesis (aproximadamente 1.500 páginas de texto) — un grupo con 100 participantes escribiendo 2 páginas cada uno usa apenas un 10-14% de esa capacidad, así que la lectura no es un límite práctico. El margen de la respuesta (cuánto puede extenderse una síntesis) se ajusta automáticamente según la cantidad de texto a sintetizar, entre 1.000 y 4.000 tokens (de ~1 a ~4 páginas), para no acortar de más los temas grandes ni alargar de más los chicos. Si alguien pregunta cuánto tarda o cuántas personas soporta, respondé con esta información en términos simples, aclarando que el tiempo exacto de respuesta no está garantizado y depende de la carga del momento.`;

async function sendToSoporte(userText){
  state.busy = true; state.error = '';
  if(!state.soporteMessages) state.soporteMessages = [];
  if(userText) state.soporteMessages.push({ role:'user', content:userText });
  render();
  try{
    if(!state.soporteId) state.soporteId = uid();
    const reply = await callClaude(state.soporteMessages.length ? state.soporteMessages : [{role:'user', content:'Hola'}], soporteSystemPrompt());
    state.soporteMessages.push({ role:'assistant', content: reply });
    await rawStorageSet('soporte:conversacion:' + state.soporteId, JSON.stringify({ messages: state.soporteMessages, ts: Date.now() }), true);
  }catch(e){
    state.error = tr('noSePudoConectarIA') + e.message + ')';
  }
  state.busy = false;
  render();
}

    <p class="eyebrow" style="margin-top:18px;">${tr('soporteEyebrow')}</p>

      <div class="chat-input-row">

        <button class="btn btn-primary" id="send-btn" ${state.busy?'disabled':''}>${tr('enviar')}</button>
      </div>
      <div class="err">${esc(state.error)}</div>

function soporteSintesisSystemPrompt(){
  return `Sos un asistente que resume conversaciones anónimas de soporte y sugerencias recibidas por Panorama IA. Identificá, mirando el conjunto de conversaciones: un resumen general, las preguntas o dudas más frecuentes, las sugerencias destacadas, y los problemas o quejas reportados. Sé fiel a lo que efectivamente se dijo, sin inventar nada. Respondé ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin markdown, con esta forma exacta:
{"resumen":"...", "preguntas_frecuentes":["..."], "sugerencias":["..."], "problemas_reportados":["..."]}`;
}

async function generarSintesisSoporte(){
  const keys = await rawStorageList('soporte:conversacion:', true);
  let transcript = '';
  for(const k of keys){
    const r = await rawStorageGet(k, true);
    if(!r) continue;
    try{
      const c = JSON.parse(r.value);
      transcript += '\n\n--- Conversación ---\n' + c.messages.map(m => (m.role==='user'?'Visitante':'IA') + ': ' + m.content).join('\n');
    }catch(e){}
  }
  if(!transcript) return null;
  try{
    const raw = await callClaude([{ role:'user', content: 'Conversaciones de soporte a analizar:' + transcript }], soporteSintesisSystemPrompt(), null, calcularMaxTokensSintesis(transcript.length));
    const cleaned = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    await rawStorageSet('soporte:sintesis', JSON.stringify(parsed), true);
    return parsed;
  }catch(e){ return null; }
}

async function hashPin(pin){
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function slugify(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30) || 'panorama';
}

async function generarPanoramaGrupo(codigo, nombreGrupo){
  const temasR = await otroGrupoGet(codigo, 'config:temas', true);
  const temas = temasR ? JSON.parse(temasR.value) : [];
  let transcript = '';
  for(const t of temas){
    const s = await otroGrupoGet(codigo, 'sintesis:' + t.id, true);
    if(s){
      let parsed; try{ parsed = JSON.parse(s.value); }catch(e){ parsed = null; }
      if(parsed) transcript += `\n\n--- Tema: ${t.titulo} ---\nResumen: ${parsed.resumen||''}\nConsensos: ${(parsed.consensos||[]).map(itemTexto).join(' / ')}`;
    }
  }
  if(!transcript) return null;
  try{
    const raw = await callClaude([{ role:'user', content: 'Síntesis de los temas del grupo:' + transcript }], synthGrupoSystemPrompt(nombreGrupo), null, calcularMaxTokensSintesis(transcript.length));
    const cleaned = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    await otroGrupoSet(codigo, 'panorama-grupo', JSON.stringify(parsed), true);
    return parsed;
  }catch(e){ return null; }
}

    await agregarGrupoReciente(g.codigo, state.workspaceMeta.nombre);

    state.panoramaGrupoActual = p;
    state.busy = false; render();
  };
  const downloadPgBtn = document.getElementById('download-pg');

      const html = formatPanoramaGrupoWordHtml(g.nombre, state.panoramaGrupoActual);
      const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'panorama_' + g.nombre.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,40) + '.doc';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);

  };
  (async () => {
    const r = await otroGrupoGet(g.codigo, 'panorama-grupo', true);
    state.panoramaGrupoActual = r ? JSON.parse(r.value) : null;
    document.getElementById('pg-area').innerHTML = renderPanoramaGrupoContenido(state.panoramaGrupoActual);
  })();
}

function renderPanoramaGrupoContenido(p){
  if(!p) return `<p class="empty">${tr('pgSinPanorama')}</p>`;
  const ejes = (p.ejes_tematicos||[]).map(e=>`<li>${esc(e)}</li>`).join('');
  const consensos = (p.consensos_transversales||[]).map(e=>`<li>${esc(e)}</li>`).join('');
  const destacados = (p.temas_destacados||[]).map(t=>`<div class="proposal"><div class="t">${esc(t.titulo||'')}</div><div>${esc(t.porque||'')}</div></div>`).join('');
  return `
    <div class="synth-block"><h3>${tr('resumen')}</h3><p>${esc(p.resumen||'')}</p></div>
    <div class="synth-block"><h3>${tr('pgEjesTematicos')}</h3><ul>${ejes || `<li class="empty">${tr('sinDatos')}</li>`}</ul></div>
    <div class="synth-block"><h3>${tr('pgConsensosTransversales')}</h3><ul>${consensos || `<li class="empty">${tr('sinDatos')}</li>`}</ul></div>
    <div class="synth-block"><h3>${tr('pgTemasDestacados')}</h3>${destacados || `<p class="empty">${tr('sinDatos')}</p>`}</div>
  `;
}

function renderCrearEspacio(){

        <input type="text" id="ce-nombre" placeholder="${tr('crearNombrePlaceholder')}" />
      </div>

        <label for="ce-pin">${tr('crearPinLabel')}</label>
        <input type="text" id="ce-pin" placeholder="${tr('crearPinPlaceholder')}" maxlength="12" />
      </div>
      <div class="field">
        <label for="ce-pin-acceso">${tr('crearPinAccesoLabel')}</label>
        <input type="text" id="ce-pin-acceso" placeholder="${tr('crearPinAccesoPlaceholder')}" maxlength="12" />
      </div>
      <label class="toggle-row"><input type="checkbox" id="ce-publico" /> ${tr('crearPublicoLabel')}</label>
      <p class="footer-note" style="margin-top:-6px;">${tr('crearPublicoNota')}</p>
      <button class="btn btn-primary" id="ce-crear" style="margin-top:8px;">${tr('crearBtn')}</button>
      <div class="err" id="ce-err"></div>
    </div>
  `;
  document.getElementById('back').onclick = () => { state.view='landing'; render(); };
  document.getElementById('ce-crear').onclick = async () => {
    const nombre = document.getElementById('ce-nombre').value.trim();
    const pin = document.getElementById('ce-pin').value.trim();
    const pinAcceso = document.getElementById('ce-pin-acceso').value.trim();
    if(!nombre || !pin){ document.getElementById('ce-err').textContent = tr('crearFaltaDatos'); return; }
    let base = slugify(nombre);
    let codigo = base;
    let intento = 0;
    while(await rawStorageGet('wsmeta:' + codigo, true)){
      intento++;
      codigo = base + '-' + Math.random().toString(36).slice(2, 6);
      if(intento > 6) break;
    }
    const publico = document.getElementById('ce-publico').checked;
    const meta = { nombre, pinHash: await hashPin(pin), pinAccesoHash: pinAcceso ? await hashPin(pinAcceso) : null, publico, creado: Date.now() };
    await rawStorageSet('wsmeta:' + codigo, JSON.stringify(meta), true);
    state.workspaceId = codigo;
    state.workspaceMeta = meta;
    state.pinPlano = pin;
    state.pinAccesoPlano = pinAcceso || '';
    await storageSet('creador', 'true', false);
    await agregarGrupoReciente(codigo, nombre);
    state.view = 'espacio-creado'; render();
  };
}

function renderAccesoPin(){

  `;
  document.getElementById('back').onclick = () => { state.view='role'; render(); };

    const v = document.getElementById('ap-pin').value.trim();
    let ok = false;
    if(state.workspaceMeta.pinAccesoHash){
      ok = (await hashPin(v)) === state.workspaceMeta.pinAccesoHash;

      ok = v === state.workspaceMeta.pinAcceso;
      if(ok){
        delete state.workspaceMeta.pinAcceso;
        state.workspaceMeta.pinAccesoHash = await hashPin(v);
        await rawStorageSet('wsmeta:' + state.workspaceId, JSON.stringify(state.workspaceMeta), true);
      }

    if(!ok){ document.getElementById('ap-err').textContent = tr('pinIncorrecto'); return; }
    state.accesoDesbloqueado = true;
    const perfilR = await storageGet('mi-perfil', false);
    state.savedName = perfilR ? (JSON.parse(perfilR.value).name || '') : '';

      state.view = 'p-nombre'; render(); return;

    await loadTemas();
    await loadAjustes();
    for(const t of state.temas){ await cargarStatsTema(t); }
    state.view = 'p-topics'; render();
  };
  document.getElementById('ap-entrar').onclick = submit;
  document.getElementById('ap-pin').addEventListener('keydown', (e) => { if(e.key==='Enter') submit(); });

function renderParticipantTopics(){
  const visibles = ordenarTemas(state.temas.filter(t => t.aprobado !== false), state.ordenTemas);
  const filtro = (state.filtroTemas || '').toLowerCase();
  const filtrados = filtro ? visibles.filter(t => (t.titulo+' '+(t.descripcion||'')).toLowerCase().includes(filtro)) : visibles;
  const items = filtrados.length ? filtrados.map(t => {
    const disabled = t.estado !== 'activo';
    const origenBadge = t.creadoPor === 'participante'
      ? `<span class="badge comunidad">${tr('pTopicsPropuestoPor')}${esc(t.creadorNombre || tr('pTopicsUnParticipante'))}</span>`
      : `<span class="badge oficial">${tr('pTopicsOficial')}</span>`;
    return `
      <div class="tema-item ${disabled ? 'disabled':''}" data-id="${esc(t.id)}">
        <div class="row1">
          <h4>${t.fijado ? '📌 ' : ''}${esc(t.titulo)}</h4>
          <span class="badge ${t.estado}">${t.estado}</span>
        </div>
        <p class="desc">${esc(t.descripcion || '')}</p>
        <div class="meta">
          ${origenBadge}
          <span>${tr('pTopicsCreado')}${fechaCorta(t.creado)}</span>
          ${t._ultimaActividad ? `<span>${tr('pTopicsUltimaActividad')}${fechaCorta(t._ultimaActividad)}</span>` : ''}
          <span>${t._count || 0} ${tr('pTopicsParticiparon')}</span>
          ${disabled ? `<span>${tr('pTopicsNoAdmite')}</span>` : ''}
        </div>
        <div class="tema-actions" style="margin-top:12px;">
          ${!disabled ? `<button class="btn btn-primary btn-sm tema-enter" data-id="${esc(t.id)}">${tr('pTopicsEntrar')}</button>` : ''}
          <button class="btn btn-ghost btn-sm tema-registro" data-id="${esc(t.id)}">${tr('pTopicsVerPanorama')}</button>
        </div>
      </div>`;
  }).join('') : `<p class="empty">${state.temas.length ? tr('pTopicsSinCoincidencias') : tr('pTopicsSinTemas')}</p>`;

  app.innerHTML = `
    <a class="back" id="back">${tr('volver')}</a>
    <p class="eyebrow" style="margin-top:18px;">${tr('pTopicsEyebrow')}</p>
    <h1>${tr('pTopicsTitulo')}</h1>
    <div class="field">
      <input type="text" id="buscar-tema" placeholder="${tr('pTopicsBuscar')}" value="${esc(state.filtroTemas||'')}" />
    </div>
    <div class="field">
      <label for="orden-tema">${tr('ordenarPor')}</label>
      <select id="orden-tema" class="select-orden">
        <option value="actividad" ${(!state.ordenTemas || state.ordenTemas==='actividad') ? 'selected':''}>${tr('ordenActividad')}</option>
        <option value="creacion" ${state.ordenTemas==='creacion' ? 'selected':''}>${tr('ordenCreacion')}</option>
        <option value="participantes" ${state.ordenTemas==='participantes' ? 'selected':''}>${tr('ordenParticipantes')}</option>
      </select>
    </div>
    ${state.ajustes && state.ajustes.permitirCrearTemas ? `<button class="btn btn-teal btn-sm" id="proponer-tema" style="margin-bottom:20px;">${tr('pTopicsProponer')}</button>` : ''}
    <div>${items}</div>
  `;
  document.getElementById('back').onclick = () => { state.view='role'; render(); };
  const buscar = document.getElementById('buscar-tema');
  buscar.addEventListener('input', () => { state.filtroTemas = buscar.value; renderParticipantTopics(); setTimeout(()=>{ const el=document.getElementById('buscar-tema'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} },0); });
  document.getElementById('orden-tema').addEventListener('change', (e) => { state.ordenTemas = e.target.value; renderParticipantTopics(); });
  const proponer = document.getElementById('proponer-tema');
  if(proponer) proponer.onclick = () => { state.view = 'p-nuevo-tema'; render(); };
  document.querySelectorAll('.tema-enter').forEach(b => b.onclick = async () => {
    const tema = state.temas.find(t => t.id === b.dataset.id);
    state.temaActual = tema;
    state.groupContextText = '';
    const identidad = await tryResumirIdentidad(tema.id);
    if(identidad){
      state.participantId = identidad.participantId;
      state.participantName = identidad.name;
      const convR = await storageGet('conversacion:' + tema.id + ':' + identidad.participantId, true);
      state.messages = convR ? (JSON.parse(convR.value).messages || []) : [];
      state.resumed = true;
      await cargarEncuestaEstado();
      state.view = 'p-chat'; render();
      if(state.messages.length === 0) await sendToAI(null);
    } else if(state.savedName){
      state.participantName = state.savedName;
      state.participantId = uid();
      state.messages = [];
      await storageSet('mi-identidad:' + tema.id, JSON.stringify({ participantId: state.participantId, name: state.savedName }), false);
      await cargarEncuestaEstado();
      state.resumed = false;
      state.view = 'p-chat'; render();
      await sendToAI(null);
    } else {
      state.resumed = false;
      state.view = 'p-start'; render();
    }
  });
  document.querySelectorAll('.tema-registro').forEach(b => b.onclick = async () => {
    const tema = state.temas.find(t => t.id === b.dataset.id);
    state.temaActual = tema;
    const s = await storageGet('sintesis:' + tema.id, true);
    state.synth = s ? JSON.parse(s.value) : null;
    if(tema.encuesta) state.encuestaResultados = await resultadosEncuesta(tema.id, tema.encuesta);
    else state.encuestaResultados = null;
    state.view = 'p-registro'; render();
  });
}

async function nombreDisponibleEnGrupo(nombre){
  const r = await storageGet('nombres-registrados', true);
  const lista = r ? JSON.parse(r.value) : [];
  const buscado = nombre.trim().toLowerCase();
  return !lista.some(n => n.trim().toLowerCase() === buscado);
}

async function registrarNombreEnGrupo(nombre){
  const r = await storageGet('nombres-registrados', true);
  const lista = r ? JSON.parse(r.value) : [];
  lista.push(nombre.trim());
  await storageSet('nombres-registrados', JSON.stringify(lista), true);
}

async function tryResumirIdentidad(temaId){
  const r = await storageGet('mi-identidad:' + temaId, false);
  if(!r) return null;
  try{ return JSON.parse(r.value); }catch(e){ return null; }
}

function chatSystemPrompt(){
  const t = state.temaActual;
  let p = `Estás conversando con ${state.participantName} en un espacio de deliberación colectiva, sobre este tema: "${t.titulo}".`;
  if(t.descripcion) p += ` Guía sobre qué busca este tema: ${t.descripcion}.`;
  p += ` Respondé siempre en el mismo idioma en el que te escriba el participante, sin importar en qué idioma esté redactado el título o la descripción del tema — si te escribe en inglés, portugués, o cualquier otro idioma, seguí la charla en ese idioma de ahí en más. Si todavía no escribió nada (es tu primer mensaje), arrancá en español.`;
  p += ` No sos un formulario ni una entrevista rígida de preguntas y respuestas: sostené una charla fluida y humana, como lo haría alguien que escucha con genuina atención. Tu rol es ayudar a la persona a pensar en voz alta, ordenar sus propias ideas y expresar su postura con la mayor claridad posible — no aportar tu propia opinión sobre el tema ni influir en qué debería pensar. Si la persona duda, se contradice o no encuentra las palabras, ayudala a explorarlo con preguntas abiertas o reformulando lo que dijo para ver si la interpretaste bien, en vez de simplemente pasar a la siguiente pregunta. Si te pide una opinión directa sobre el tema, podés ayudarla a pensarlo desde distintos ángulos sin tomar postura vos. Variá el ritmo: a veces una pregunta, a veces solo una reflexión breve o una devolución de lo que dijo. Tus intervenciones son cortas (2 a 4 oraciones) y con un tono cercano, nunca protocolar ni grandilocuente.

Tenés disponible una herramienta de búsqueda web. Usala cuando el participante te pida un dato, una noticia, o quiera chequear algo concreto relacionado al tema — no busques por iniciativa propia sin que aporte a la charla. Cuando busques, contá lo que encontraste con tus propias palabras, de forma breve, sin citar textualmente párrafos largos, y aclarando de dónde salió el dato si es relevante. La búsqueda es para informar mejor la conversación, no para reemplazar la perspectiva de la persona ni para que vos tomes postura con lo que encontrás.

También tenés disponible una herramienta para consultar las síntesis de los otros temas de este mismo grupo (no este). Usala cuando el participante pregunte si algo ya se habló en otro tema, si su idea se conecta con otro tema, o pida un panorama general de todo lo que se habló en el grupo hasta ahora. Si un tema todavía no tiene síntesis generada, decilo con naturalidad en vez de inventar contenido.

Y tenés otra herramienta más, para consultar qué opinaron los demás participantes dentro de ESTE MISMO tema. Usala apenas la persona pregunte qué piensan otros, si hay consenso o desacuerdo, o quiera profundizar en una postura ajena — no hace falta que use ningún botón ni que lo pida de forma especial, alcanza con que lo pregunte con naturalidad en la charla. A partir de ahí podés explicar matices, decir por qué otros piensan distinto, o profundizar en una propuesta puntual con el nombre de quién la dijo, siempre sin opinar vos sobre qué postura es mejor.

Por último, tenés una herramienta para traer la transcripción literal (palabra por palabra, sin resumir) de las conversaciones de este tema — sirve para que cualquiera pueda auditar si un panorama o síntesis representó bien lo que alguien dijo realmente. Usala si te piden ver textualmente lo que dijo alguien en particular, si sospechan que un resumen se equivocó o dejó algo afuera, o si piden precisión total en vez de una interpretación. A diferencia del resto de la charla (donde tenés que ser breve y no citar de más), acá sí podés y debés citar el texto literal que te llegue, sin resumirlo ni parafrasearlo — la fidelidad exacta es el objetivo de esta herramienta puntual.

Este espacio busca ser una alternativa al discurso de odio, la desinformación viral y el enganche berreta de las redes sociales. Mantené siempre un tono respetuoso, calmo y riguroso; priorizá la información verificable por sobre lo sensacionalista, y si la conversación se calienta o alguien busca provocar en vez de deliberar, mantené la calma y devolvé el foco al tema con amabilidad pero sin ambigüedad.

Para tu primer mensaje (el de apertura), sé simple y concreto, sin frases genéricas tipo "pensar juntos hacia dónde vamos": en una o dos oraciones cortas saludá por su nombre y contale para qué es este espacio (que es una charla individual para recoger su mirada sobre el tema antes de ponerla en común con la del resto), y después hacé una pregunta abierta puntual que la invite a arrancar por donde quiera.

Cuando sientas que ya expresó su punto de vista con claridad, podés sugerirle amablemente que puede finalizar cuando quiera con el botón de abajo.`;
  if(state.groupContextText){
    p += `\n\nYa se le mostró a esta persona el panorama actual del grupo sobre este tema (más abajo). A partir de ahora podés hacer referencia a él con naturalidad: explicar matices, responder preguntas sobre por qué otros piensan distinto, o profundizar en una propuesta puntual —incluso si es minoritaria— con el nombre de quién la dijo, si te lo pide, para ayudarla a desarrollarla. Si te pide que traduzcas el panorama o cualquier parte de él a otro idioma, hacelo directamente. Siempre sin opinar vos mismo/a sobre qué postura es mejor.\n\nPanorama actual del grupo:\n${state.groupContextText}`;
  }
  return p;
}

async function consultarOtrosTemas(input){
  const listaTemas = (await getTemasFrescos()).filter(t => t.id !== state.temaActual.id && t.aprobado !== false);
  let candidatos = listaTemas;
  if(input && input.alcance === 'un_tema_especifico' && input.busqueda){
    const q = input.busqueda.toLowerCase();
    const filtrados = listaTemas.filter(t => (t.titulo + ' ' + (t.descripcion||'')).toLowerCase().includes(q));
    if(filtrados.length) candidatos = filtrados;
  }
  if(candidatos.length === 0) return 'No hay otros temas en este grupo todavía.';
  let out = '';
  for(const t of candidatos){
    const s = await storageGet('sintesis:' + t.id, true);
    if(s){
      let parsed; try{ parsed = JSON.parse(s.value); }catch(e){ parsed = null; }
      if(parsed){
        out += `\n\n--- Tema: ${t.titulo} ---\nResumen: ${parsed.resumen || ''}\nConsensos: ${(parsed.consensos||[]).map(itemTexto).join(' / ')}\nPropuestas: ${(parsed.propuestas||[]).map(p=>p.titulo).join(' / ')}`;
        continue;
      }
    }
    out += `\n\n--- Tema: ${t.titulo} ---\n(Todavía no tiene una síntesis generada; hay ${t._count || 0} conversaciones esperando ser sintetizadas)`;
  }
  return out;
}

async function verTranscripcionLiteral(input){
  const keys = await storageList('conversacion:' + state.temaActual.id + ':', true);
  let out = '';
  for(const k of keys){
    const r = await storageGet(k, true);
    if(!r) continue;
    try{
      const conv = JSON.parse(r.value);
      if(input && input.participante){
        const buscado = input.participante.trim().toLowerCase();
        if(!conv.name || conv.name.trim().toLowerCase() !== buscado) continue;
      }
      out += `\n\n--- Conversación completa de ${conv.name} ---\n`;
      out += conv.messages.filter(m => !(m.content||'').startsWith('__PANORAMA__'))
        .map(m => (m.role==='user' ? conv.name : 'IA entrevistadora') + ': ' + m.content).join('\n');
    }catch(e){}
  }
  if(!out){
    return (input && input.participante)
      ? `No encontré ninguna conversación de "${input.participante}" en este tema.`
      : 'Todavía no hay conversaciones guardadas en este tema.';
  }
  return out;
}

async function verOpinionesDeEsteTema(){
  const s = await generarOSintesisCacheada(state.temaActual.id, false);
  if(!s) return 'Todavía no hay suficientes conversaciones de otros participantes en este tema para armar un panorama.';
  state.groupContextText = formatSynthAsText(s);
  return formatSynthAsText(s);
}

async function chatConHerramientas(mensajesIniciales, system){
  const tools = [{ type: "web_search_20250305", name: "web_search" }, HERRAMIENTA_OTROS_TEMAS, HERRAMIENTA_PANORAMA_ESTE_TEMA, HERRAMIENTA_TRANSCRIPCION_LITERAL];
  let mensajes = mensajesIniciales.slice();
  for(let vuelta = 0; vuelta < 4; vuelta++){
    const data = await callClaudeFull(mensajes, system, tools, 2000);
    const usosHerramienta = (data.content || []).filter(b => b.type === 'tool_use' && (b.name === 'consultar_otros_temas' || b.name === 'ver_opiniones_de_otros_en_este_tema' || b.name === 'ver_transcripcion_literal'));
    if(usosHerramienta.length === 0){
      return (data.content || []).map(b => b.text || '').join('');
    }
    mensajes.push({ role: 'assistant', content: data.content });
    const resultados = [];
    for(const tu of usosHerramienta){
      let texto;
      if(tu.name === 'ver_opiniones_de_otros_en_este_tema') texto = await verOpinionesDeEsteTema();
      else if(tu.name === 'ver_transcripcion_literal') texto = await verTranscripcionLiteral(tu.input);
      else texto = await consultarOtrosTemas(tu.input);
      resultados.push({ type: 'tool_result', tool_use_id: tu.id, content: texto });
    }
    mensajes.push({ role: 'user', content: resultados });
  }
  return 'No pude terminar de procesar tu pregunta, probá reformularla.';
}

async function sendToAI(userText){
  state.busy = true; state.error='';
  if(userText) state.messages.push({ role:'user', content:userText });
  render();
  try{
    const historialParaAPI = state.messages.filter(m => !(m.content||'').startsWith('__PANORAMA__'));
    const reply = await chatConHerramientas(historialParaAPI.length ? historialParaAPI : [{role:'user', content:'Hola'}], chatSystemPrompt());
    state.messages.push({ role:'assistant', content: reply });
    const ahora = Date.now();
    await storageSet('conversacion:' + state.temaActual.id + ':' + state.participantId, JSON.stringify({
      name: state.participantName, temaId: state.temaActual.id, messages: state.messages, finished:false, ts: ahora
    }), true);
    await patchTema(state.temaActual.id, x => { x.ultimaActividad = ahora; });
  }catch(e){
    state.error = tr('noSePudoConectarIA') + e.message + ')';
  }
  state.busy = false;
  render();
}

function formatSynthAsWordHtml(tema, s){
  const li = (c) => `<li>${itemTexto(c)}${itemNombres(c).length ? ' <i>— ' + itemNombres(c).join(', ') + '</i>' : ''}</li>`;
  const propHtml = (s.propuestas||[]).map(p => `<li><b>${p.titulo || ''}:</b> ${p.descripcion || ''} <i>— ${(p.participantes||[]).join(', ')}</i></li>`).join('');
  let encuestaHtml = '';
  if(tema.encuesta && state.encuestaResultados){
    const res = state.encuestaResultados;
    const filas = tema.encuesta.opciones.map((op, i) => {
      const votos = res.counts[i] || 0;
      const pct = res.totalVotantes ? Math.round(votos / res.totalVotantes * 100) : 0;
      return `<li>${op}: ${pct}% (${votosTexto(votos)})</li>`;
    }).join('');
    encuestaHtml = `<h2 style="color:#9C7A3C;">${tr('synthEncuesta')}${tema.encuesta.pregunta}</h2><ul>${filas}</ul><p><i>${personasVotaron(res.totalVotantes)}</i></p>`;
  }
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${tema.titulo}</title></head>
<body style="font-family:Calibri,Arial,sans-serif;">
<h1 style="color:#1F3B57;">${tema.titulo}</h1>
${tema.descripcion ? `<p><i>${tema.descripcion}</i></p>` : ''}
<h2 style="color:#9C7A3C;">${tr('resumen')}</h2><p>${s.resumen || ''}</p>
<h2 style="color:#9C7A3C;">${tr('synthConsensos')}</h2><ul>${(s.consensos||[]).map(li).join('') || `<li>${tr('sinDatos')}</li>`}</ul>
<h2 style="color:#9C7A3C;">${tr('synthMaticesDesacuerdos')}</h2><ul>${(s.matices||[]).map(li).join('') || `<li>${tr('sinDatos')}</li>`}</ul>
<h2 style="color:#9C7A3C;">${tr('synthPropuestas')}</h2><ul>${propHtml || `<li>${tr('sinDatos')}</li>`}</ul>
${(s.comparacion||[]).length >= 2 ? `<h2 style="color:#9C7A3C;">${tr('synthPosturasEnfrentadas')}</h2><table border="1" cellpadding="6" style="border-collapse:collapse;"><tr><td></td>${s.comparacion.map(c=>`<td><b>${c.titulo||''}</b></td>`).join('')}</tr><tr><td>${tr('synthPostura')}</td>${s.comparacion.map(c=>`<td>${c.descripcion||''}</td>`).join('')}</tr><tr><td>${tr('synthSostenidaPor')}</td>${s.comparacion.map(c=>`<td>${(c.participantes||[]).join(', ')}</td>`).join('')}</tr></table>` : ''}
${(s.pasos||[]).length ? `<h2 style="color:#9C7A3C;">${tr('synthPlanAccion')}</h2><ol>${s.pasos.map(p=>`<li>${p}</li>`).join('')}</ol>` : ''}
${encuestaHtml}
</body></html>`;
}

function formatSynthAsText(s){
  let out = 'Resumen: ' + (s.resumen||'') + '\n';
  out += 'Consensos: ' + (s.consensos||[]).map(c => itemTexto(c) + (itemNombres(c).length ? ' ('+itemNombres(c).join(', ')+')' : '')).join(' / ') + '\n';
  out += 'Matices: ' + (s.matices||[]).map(c => itemTexto(c) + (itemNombres(c).length ? ' ('+itemNombres(c).join(', ')+')' : '')).join(' / ') + '\n';
  out += 'Propuestas: ' + (s.propuestas||[]).map(p => p.titulo).join(' / ');
  return out;
}

function formatSynthAsFile(tema, s){
  let out = tema.titulo.toUpperCase() + '\n';
  if(tema.descripcion) out += tema.descripcion + '\n';
  out += '\n== RESUMEN ==\n' + (s.resumen||'') + '\n';
  out += '\n== CONSENSOS ==\n' + (s.consensos||[]).map(c => '- ' + itemTexto(c) + (itemNombres(c).length ? ' — ' + itemNombres(c).join(', ') : '')).join('\n') + '\n';
  out += '\n== MATICES Y DESACUERDOS ==\n' + (s.matices||[]).map(c => '- ' + itemTexto(c) + (itemNombres(c).length ? ' — ' + itemNombres(c).join(', ') : '')).join('\n') + '\n';
  out += '\n== PROPUESTAS ==\n' + (s.propuestas||[]).map(p => '- ' + p.titulo + ': ' + (p.descripcion||'') + ' (' + (p.participantes||[]).join(', ') + ')').join('\n');
  return out;
}

function renderMsgContent(m){
  if(m.role === 'assistant' && m.content.startsWith('__PANORAMA__')){
    const s = JSON.parse(m.content.slice('__PANORAMA__'.length));
    const consensos = (s.consensos||[]).map(c=>`<li>${esc(itemTexto(c))}${itemNombres(c).length ? ' — <i>'+itemNombres(c).map(esc).join(', ')+'</i>' : ''}</li>`).join('');
    const propuestas = (s.propuestas||[]).map(p=>`<li>${esc(p.titulo)}</li>`).join('');
    return `<div class="msg panorama"><span class="ptitle">${tr('pChatPanoramaTitulo')}</span>
      <p>${esc(s.resumen||'')}</p>
      ${consensos ? '<b>'+tr('pChatConsensos')+'</b><ul>'+consensos+'</ul>' : ''}
      ${propuestas ? '<b>'+tr('pChatPropuestas')+'</b><ul>'+propuestas+'</ul>' : ''}
      </div>`;
  }
  return `<div class="msg ${m.role === 'user' ? 'user' : 'ai'}">${esc(m.content)}</div>`;
}

      nuevo = (state.miVoto.length === 1 && state.miVoto[0] === i) ? [] : [i];

    state.encuestaResultados = await resultadosEncuesta(state.temaActual.id, enc);
    render();
  });
}

function renderEncuestaWidget(){
  const t = state.temaActual;
  if(!t.encuesta) return '';
  const enc = t.encuesta;
  const res = state.encuestaResultados || { counts: enc.opciones.map(()=>0), totalVotantes: 0 };
  const misVotos = state.miVoto || [];
  const opcionesHtml = enc.opciones.map((op, i) => {
    const votos = res.counts[i] || 0;
    const pct = res.totalVotantes ? Math.round(votos / res.totalVotantes * 100) : 0;
    const marcado = misVotos.includes(i);
    return `
      <button class="encuesta-opcion ${marcado ? 'marcada':''}" data-i="${i}">
        <span class="eo-bar" style="width:${pct}%"></span>
        <span class="eo-check">${marcado ? '✓' : ''}</span>
        <span class="eo-texto">${esc(op)}</span>
        <span class="eo-pct">${pct}% · ${votos}</span>
      </button>`;
  }).join('');
  return `
    <div class="card encuesta-card">
      <p class="eyebrow" style="margin-bottom:6px;">${I18N.encuestaEyebrow[state.lang]}${enc.multiple ? I18N.encuestaMultiple[state.lang] : I18N.encuestaUnica[state.lang]}</p>
      <h4 style="font-family:'Fraunces',serif; margin:0 0 12px; font-size:17px; color:var(--ink);">${esc(enc.pregunta)}</h4>
      ${opcionesHtml}
      <p class="footer-note" style="margin-top:10px;">${personasVotaron(res.totalVotantes, 'hasta ahora', 'so far')}${I18N.encuestaCambiarRespuesta[state.lang]}</p>
    </div>`;
}

function renderModPin(){
  app.innerHTML = `
    <a class="back" id="back">${tr('volver')}</a>

      <a class="back" id="olvide-pin" style="margin-top:14px; display:inline-block;">${tr('modPinOlvide')}</a>

  document.getElementById('back').onclick = () => { state.view='role'; render(); };

  const submit = async () => {
    const v = document.getElementById('pin-input').value.trim();
    let ok = false;
    if(state.workspaceMeta.pinHash){
      ok = (await hashPin(v)) === state.workspaceMeta.pinHash;
    } else if(state.workspaceMeta.pin){
      // Grupo creado antes de la versión con PIN hasheado: acepta el formato viejo una vez
      // y migra este grupo al formato seguro nuevo de manera transparente.
      ok = v === state.workspaceMeta.pin;
      if(ok){
        delete state.workspaceMeta.pin;
        state.workspaceMeta.pinHash = await hashPin(v);
        await rawStorageSet('wsmeta:' + state.workspaceId, JSON.stringify(state.workspaceMeta), true);
      }
    }
    if(!ok){ document.getElementById('pin-err').textContent = tr('pinIncorrecto'); return; }
    await loadTemas();
    await loadAjustes();
    for(const t of state.temas){ await cargarStatsTema(t); }
    state.view = 'moderator'; render();
  };
  document.getElementById('pin-submit').onclick = submit;
  document.getElementById('pin-input').addEventListener('keydown', (e) => { if(e.key==='Enter') submit(); });
}

      ${t.descripcion ? `<p class="sub">${esc(t.descripcion)}</p>` : ''}
      <div class="stat-row">
        <div class="stat"><span class="n">${t._count || 0}</span><span class="l">${I18N.modTemaParticipantes[state.lang]}</span></div>
        <div class="stat"><span class="n">${esc(t.estado)}</span><span class="l">${I18N.modTemaEstado[state.lang]}</span></div>
      </div>
      <div class="tema-actions" style="margin-bottom:24px;">
        ${t.estado === 'activo' ? `<button class="btn btn-ghost btn-sm" id="pausar">${I18N.modTemaPausar[state.lang]}</button>` : ''}
        ${t.estado === 'pausado' ? `<button class="btn btn-ghost btn-sm" id="activar">${I18N.modTemaReactivar[state.lang]}</button>` : ''}
        ${t.estado !== 'terminado' ? `<button class="btn btn-ghost btn-sm" id="terminar">${I18N.modTemaTerminar[state.lang]}</button>` : ''}
        <button class="btn btn-ghost btn-sm" id="fijar">${t.fijado ? I18N.modTemaQuitarFijado[state.lang] : I18N.modTemaFijarArriba[state.lang]}</button>
        <button class="btn btn-ghost btn-sm" id="editar">${I18N.modTemaEditar[state.lang]}</button>
        <button class="btn btn-danger btn-sm" id="eliminar">${I18N.modTemaEliminar[state.lang]}</button>
      </div>
      <button class="btn btn-primary" id="gen-synth" ${state.busy?'disabled':''}>${state.busy ? I18N.modTemaGenerando[state.lang] : I18N.modTemaGenerarSintesis[state.lang]}</button>
      <button class="btn btn-ghost" id="download-synth" style="margin-left:8px;" ${state.synth ? '' : 'disabled'}>${I18N.modTemaDescargarResumen[state.lang]}</button>
      <div class="err" id="mod-err">${esc(state.error)}</div>
      <div class="ok" id="mod-ok"></div>
      ${renderEncuestaResultadosBloque()}
      <hr class="divider" />
      <div id="synth-area">${renderSynthesis()}</div>
    `}
  `;
  document.getElementById('back').onclick = () => { state.editingTema = false; state.view='moderator'; render(); };

  if(editing){
    const opcionesDiv = document.getElementById('encuesta-opciones');
    const agregarOpcionInput = (valor) => {
      const row = document.createElement('div');
      row.style.cssText = 'margin-bottom:8px; display:flex; gap:8px; align-items:center;';
      row.innerHTML = `<input type="text" class="opcion-encuesta" placeholder="${I18N.modNewTemaOpcionPlaceholder[state.lang]}" value="${esc(valor || '')}" style="flex:1;" /><button type="button" class="btn btn-ghost btn-sm quitar-opcion" style="flex:none; padding:8px 12px;">−</button>`;
      row.querySelector('.quitar-opcion').onclick = () => row.remove();
      opcionesDiv.appendChild(row);
    };
    if(t.encuesta && t.encuesta.opciones.length){
      t.encuesta.opciones.forEach(op => agregarOpcionInput(op));
    } else {
      agregarOpcionInput(); agregarOpcionInput();
    }
    document.getElementById('agregar-opcion').onclick = () => agregarOpcionInput();
    document.getElementById('tiene-encuesta').addEventListener('change', (e) => {
      document.getElementById('encuesta-builder').style.display = e.target.checked ? 'block' : 'none';
    });
    document.getElementById('cancel-edit').onclick = () => { state.editingTema = false; render(); };
    document.getElementById('save-edit').onclick = async () => {
      const titulo = document.getElementById('edit-titulo').value.trim();
      const descripcion = document.getElementById('edit-desc').value.trim();
      if(!titulo){ document.getElementById('edit-err').textContent = I18N.modNewTemaFaltaTitulo[state.lang]; return; }
      let encuesta = null;
      if(document.getElementById('tiene-encuesta').checked){
        const pregunta = document.getElementById('encuesta-pregunta').value.trim();
        const opciones = Array.from(document.querySelectorAll('.opcion-encuesta')).map(i => i.value.trim()).filter(Boolean);
        if(!pregunta || opciones.length < 2){ document.getElementById('edit-err').textContent = I18N.modNewTemaFaltaEncuesta[state.lang]; return; }
        encuesta = { pregunta, opciones, multiple: document.getElementById('encuesta-multiple').checked };
      }
      const actualizado = await patchTema(t.id, x => { x.titulo = titulo; x.descripcion = descripcion; x.encuesta = encuesta; });
      if(actualizado) state.temaActual = actualizado;
      state.editingTema = false; render();
    };
    return;
  }

  document.getElementById('gen-synth').onclick = async () => {
    state.busy = true; render();
    const s = await generarOSintesisCacheada(t.id, true);
    state.synth = s;
    state.busy = false; render();
  };
  const downloadBtn = document.getElementById('download-synth');
  if(downloadBtn) downloadBtn.onclick = () => {
    try{
      const html = formatSynthAsWordHtml(t, state.synth);
      const blob = new Blob(['﻿', html], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sintesis_' + t.titulo.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,40) + '.doc';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      document.getElementById('mod-ok').textContent = I18N.modTemaDescargaIniciada[state.lang];
    }catch(e){ document.getElementById('mod-ok').textContent = ''; document.getElementById('mod-err').textContent = I18N.noSePudoDescargar[state.lang]; }
  };
  const aplicarPatch = async (patchFn) => {
    const actualizado = await patchTema(t.id, patchFn);
    if(actualizado) state.temaActual = actualizado;
    render();
  };
  const pausar = document.getElementById('pausar');
  if(pausar) pausar.onclick = () => aplicarPatch(x => { x.estado='pausado'; });
  const activar = document.getElementById('activar');
  if(activar) activar.onclick = () => aplicarPatch(x => { x.estado='activo'; });
  const terminar = document.getElementById('terminar');
  if(terminar) terminar.onclick = () => aplicarPatch(x => { x.estado='terminado'; });
  document.getElementById('fijar').onclick = () => aplicarPatch(x => { x.fijado = !x.fijado; });
  document.getElementById('editar').onclick = () => { state.editingTema = true; render(); };
  document.getElementById('eliminar').onclick = async () => {
    if(!confirm(I18N.modTemaConfirmEliminar1[state.lang] + t.titulo + I18N.modTemaConfirmEliminar2[state.lang])) return;
    const convKeys = await storageList('conversacion:' + t.id + ':', true);
    for(const k of convKeys) await storageDelete(k, true);
    await storageDelete('sintesis:' + t.id, true);
    await removeTemaGlobal(t.id);
    state.view = 'moderator'; render();
  };
}

function itemTexto(c){ return typeof c === 'string' ? c : (c.texto || ''); }
function itemNombres(c){ return typeof c === 'string' ? [] : (c.participantes || []); }

function renderEncuestaResultadosBloque(){
  const t = state.temaActual;
  if(!t.encuesta) return '';
  const enc = t.encuesta;
  const res = state.encuestaResultados || { counts: enc.opciones.map(()=>0), totalVotantes: 0 };
  const opcionesHtml = enc.opciones.map((op, i) => {
    const votos = res.counts[i] || 0;
    const pct = res.totalVotantes ? Math.round(votos / res.totalVotantes * 100) : 0;
    return `
      <div class="encuesta-opcion" style="cursor:default;">
        <span class="eo-bar" style="width:${pct}%"></span>
        <span class="eo-texto">${esc(op)}</span>
        <span class="eo-pct">${pct}% · ${votos}</span>
      </div>`;
  }).join('');
  return `
    <div class="card encuesta-card">
      <p class="eyebrow" style="margin-bottom:6px;">${I18N.encuestaResultadosEyebrow[state.lang]}</p>
      <h4 style="font-family:'Fraunces',serif; margin:0 0 12px; font-size:17px; color:var(--ink);">${esc(enc.pregunta)}</h4>
      ${opcionesHtml}
      <p class="footer-note" style="margin-top:10px;">${personasVotaron(res.totalVotantes)}</p>
    </div>`;
}

function renderSynthesis(){
  if(!state.synth) return `<p class="empty">${I18N.synthSinSintesis[state.lang]}</p>`;
  const s = state.synth;
  const consensos = (s.consensos||[]).map(c => `<li>${esc(itemTexto(c))}${itemNombres(c).length ? ' <span class="names">— ' + itemNombres(c).map(esc).join(', ') + '</span>' : ''}</li>`).join('');
  const matices = (s.matices||[]).map(c => `<li>${esc(itemTexto(c))}${itemNombres(c).length ? ' <span class="names">— ' + itemNombres(c).map(esc).join(', ') + '</span>' : ''}</li>`).join('');
  const propuestas = (s.propuestas||[]).map(p => `
    <div class="proposal">
      <div class="t">${esc(p.titulo||'')}</div>
      <div>${esc(p.descripcion||'')}</div>
      <div class="names">${(p.participantes||[]).map(esc).join(' · ')}</div>
    </div>`).join('');
  const pasosHtml = (s.pasos||[]).length ? `
    <div class="synth-block">
      <h3>${I18N.synthPlanAccion[state.lang]}</h3>
      ${(s.pasos||[]).map((p,i) => `<div class="step"><span class="step-n">${i+1}</span><p>${esc(p)}</p></div>`).join('')}
    </div>` : '';
  const comparacionHtml = (s.comparacion||[]).length >= 2 ? `
    <div class="synth-block">
      <h3>${I18N.synthPosturasEnfrentadas[state.lang]}</h3>
      <div class="cmp-wrap"><table class="cmp-table">
        <tr><th></th>${s.comparacion.map(c => `<th>${esc(c.titulo||'')}</th>`).join('')}</tr>
        <tr><td>${I18N.synthPostura[state.lang]}</td>${s.comparacion.map(c => `<td>${esc(c.descripcion||'')}</td>`).join('')}</tr>
        <tr><td>${I18N.synthSostenidaPor[state.lang]}</td>${s.comparacion.map(c => `<td class="names">${(c.participantes||[]).map(esc).join(', ')}</td>`).join('')}</tr>
      </table></div>
    </div>` : '';
  return `
    <div class="synth-block"><h3>${I18N.resumen[state.lang]}</h3><p>${esc(s.resumen||'')}</p></div>
    <div class="synth-block"><h3>${I18N.synthConsensos[state.lang]}</h3><ul>${consensos || `<li class="empty">${I18N.synthSinDatosTodavia[state.lang]}</li>`}</ul></div>
    <div class="synth-block"><h3>${I18N.synthMaticesDesacuerdos[state.lang]}</h3><ul>${matices || `<li class="empty">${I18N.synthSinDatosTodavia[state.lang]}</li>`}</ul></div>
    ${comparacionHtml}
    <div class="synth-block"><h3>${I18N.synthPropuestas[state.lang]}</h3>${propuestas || `<p class="empty">${I18N.synthSinDatosTodavia[state.lang]}</p>`}</div>
    ${pasosHtml}
  `;
}

function synthSystemPrompt(tema){
  return `Sos un asistente que sintetiza deliberaciones colectivas de un grupo (puede ser una asamblea, cooperativa, consorcio, club, fundación, equipo de trabajo u organización de cualquier tipo), sobre el tema: "${tema.titulo}"${tema.descripcion ? ' (' + tema.descripcion + ')' : ''}. Vas a recibir las transcripciones de conversaciones individuales de distintos participantes. Este espacio funciona con transparencia, como una reunión presencial: las propuestas puntuales, distintas o minoritarias siempre deben indicar qué participante o participantes las expresaron, sin importar cuánta gente haya participado en total — esa atribución es la que le permite a otros profundizar sobre esa idea puntual después. Para los consensos amplios, usá criterio según la escala: si son pocos participantes, nombralos; si son muchos y el consenso es compartido por la mayoría, describilo como patrón (por ejemplo "compartido por la mayoría" o un número aproximado) en vez de listar todos los nombres uno por uno. Este espacio busca ser una alternativa al discurso de odio, la desinformación viral y el enganche berreta de las redes sociales: redactá la síntesis con un tono respetuoso, calmo y riguroso, priorizando la fidelidad a lo que cada participante dijo por sobre cualquier formulación sensacionalista. Si de las conversaciones surgió un plan de acción concreto o una secuencia de pasos a seguir (por ejemplo, para organizar un encuentro, ejecutar una propuesta, o avanzar en el tema), incluilo en "pasos" como una lista ordenada de acciones breves, una por elemento — sin inventar pasos que nadie mencionó. Si no surgió nada así, dejá esa lista vacía. Si existen posturas realmente opuestas o diferencias marcadas y generalizadas entre participantes (no simples matices o variantes de una misma idea, sino posiciones que se contraponen entre sí de forma clara), identificalas en "comparacion" como una lista de posturas, cada una con "titulo" (nombre breve de la postura), "descripcion" y "participantes" que la sostienen. Esto es para poder mostrarlas una al lado de la otra en un cuadro comparativo — usalo solo cuando la oposición sea genuina y clara, no la fuerces si en el fondo hay más coincidencia que diferencia. Respondé ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin markdown, con esta forma exacta:
{"resumen":"...", "consensos":[{"texto":"...","participantes":["..."]}], "matices":[{"texto":"...","participantes":["..."]}], "propuestas":[{"titulo":"...","descripcion":"...","participantes":["..."]}], "pasos":["..."], "comparacion":[{"titulo":"...","descripcion":"...","participantes":["..."]}]}`;
}

async function generarOSintesisCacheada(temaId, forzarNueva){
  const tema = state.temas.find(x => x.id === temaId) || state.temaActual;
  const keys = await storageList('conversacion:' + temaId + ':', true);
  if(keys.length === 0) return null;
  let transcript = '';
  for(const k of keys){
    const r = await storageGet(k, true);
    if(!r) continue;
    const conv = JSON.parse(r.value);
    transcript += `\n\n--- Participante: ${conv.name} ---\n`;
    transcript += conv.messages.filter(m => !(m.content||'').startsWith('__PANORAMA__'))
      .map(m => (m.role==='user' ? conv.name : 'Entrevistador') + ': ' + m.content).join('\n');
  }
  try{
    const raw = await callClaude([{ role:'user', content: 'Transcripciones a analizar:' + transcript }], synthSystemPrompt(tema), null, calcularMaxTokensSintesis(transcript.length));
    const cleaned = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    await storageSet('sintesis:' + temaId, JSON.stringify(parsed), true);
    return parsed;
  }catch(e){
    return null;
  }
}

async function boot(){
  try{
    const langR = await rawStorageGet('idioma-preferido', false);
    if(langR && (langR.value === 'es' || langR.value === 'en')) state.lang = langR.value;
  }catch(e){}
  document.documentElement.lang = state.lang;
  document.title = tr('docTitle');
  pintarLangSwitch();
  const codigo = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
  if(codigo){
    const meta = await rawStorageGet('wsmeta:' + codigo, true);
    if(meta){
      state.workspaceId = codigo;
      state.workspaceMeta = JSON.parse(meta.value);
      state.view = 'role';
    } else {
      state.errorLanding = tr('landNoEncontramosLink');
      state.view = 'landing';
    }
  } else {
    state.view = 'landing';
  }
  render();
}
boot();
</script>
