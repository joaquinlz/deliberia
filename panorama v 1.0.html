<body>
<div class="wrap" id="app"></div>
<div style="position:fixed; bottom:6px; right:10px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:rgba(159,176,180,0.35); z-index:9999;">Panorama IA v1.0</div>

<script>
const app = document.getElementById('app');
let state = {
  view: 'landing',
  workspaceId: null, workspaceMeta: null, errorLanding: '',
  temas: [],
  temaActual: null,
  participantName: '', participantId: null, messages: [], groupContextText: '',
  busy: false, error: '', synth: null, count: 0
};

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function uid(){ return 'p_' + Math.random().toString(36).slice(2,10); }

async function callClaudeFull(messages, system, tools, maxTokens){
  const body = { model:"claude-sonnet-4-6", max_tokens: maxTokens || 1000, system: system, messages: messages };
  if(tools) body.tools = tools;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let detail = '';
    try{ const b = await res.json(); detail = (b && b.error && b.error.message) || JSON.stringify(b); }catch(e){ detail = await res.text().catch(()=> ''); }
    throw new Error("api_error_" + res.status + (detail ? ": " + detail : ""));
  }
  return await res.json();
}

async function callClaude(messages, system, tools, maxTokens){
  const data = await callClaudeFull(messages, system, tools, maxTokens);
  return (data.content || []).map(b => b.text || '').join('');
}

function calcularMaxTokensSintesis(textoLength){
  // Escala el margen de respuesta según cuánto texto hay para leer y sintetizar,
  // para no gastar espacio de más en temas chicos ni quedarse corto en temas grandes.
  if(textoLength < 4000) return 1000;
  if(textoLength < 12000) return 2000;
  if(textoLength < 30000) return 3000;
  return 4000;
}

/* Almacenamiento: los datos "shared" (de grupo: temas, conversaciones, votos,
   síntesis) viajan a un Worker propio de Cloudflare con KV detrás, para que
   sobrevivan a que este artifact se vuelva a publicar con un link nuevo. Los
   datos "no shared" (perfil local, últimos grupos visitados) son propios de
   este dispositivo y se guardan directo en localStorage: no necesitan
   sincronizarse entre dispositivos ni sobrevivir a nada más que este navegador. */
const STORAGE_WORKER_URL = "https://panorama-storage.joaquinlocati.workers.dev";
const LOCAL_PREFIX = 'panoramaia:';

async function workerStorageCall(op, payload){
  try{
    const res = await fetch(STORAGE_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ op, ...payload })
    });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

async function rawStorageGet(key, shared){
  if(!shared){
    try{ const v = localStorage.getItem(LOCAL_PREFIX + key); return v === null ? null : { value: v }; }
    catch(e){ return null; }
  }
  const r = await workerStorageCall('get', { key });
  return (r && r.value !== null && r.value !== undefined) ? { value: r.value } : null;
}
async function rawStorageSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem(LOCAL_PREFIX + key, value); }catch(e){}
    return;
  }
  await workerStorageCall('set', { key, value });
}
async function rawStorageList(prefix, shared){
  if(!shared){
    const out = [];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(LOCAL_PREFIX + prefix) === 0) out.push(k.slice(LOCAL_PREFIX.length));
      }
    }catch(e){}
    return out;
  }
  const r = await workerStorageCall('list', { prefix });
  return (r && r.keys) ? r.keys : [];
}
async function rawStorageDelete(key, shared){
  if(!shared){
    try{ localStorage.removeItem(LOCAL_PREFIX + key); }catch(e){}
    return;
  }
  await workerStorageCall('delete', { key });
}

/* Todas las claves de datos de un espacio quedan prefijadas automáticamente con su código,
   así el resto del código (temas, conversaciones, síntesis, perfiles) no necesita saber
   que existen múltiples espacios aislados: solo opera "dentro" del suyo. */
function wsPrefix(){ return 'ws:' + (state.workspaceId || 'default') + ':'; }
async function storageGet(key, shared){ return rawStorageGet(wsPrefix() + key, shared); }
async function storageSet(key, value, shared){ return rawStorageSet(wsPrefix() + key, value, shared); }
async function storageList(prefix, shared){
  const keys = await rawStorageList(wsPrefix() + prefix, shared);
  const p = wsPrefix();
  return keys.map(k => k.startsWith(p) ? k.slice(p.length) : k);
}
async function storageDelete(key, shared){ return rawStorageDelete(wsPrefix() + key, shared); }

async function otroGrupoGet(codigo, key, shared){ return rawStorageGet('ws:' + codigo + ':' + key, shared); }
async function otroGrupoSet(codigo, key, value, shared){ return rawStorageSet('ws:' + codigo + ':' + key, value, shared); }
async function otroGrupoList(codigo, prefix, shared){
  const keys = await rawStorageList('ws:' + codigo + ':' + prefix, shared);
  const p = 'ws:' + codigo + ':';
  return keys.map(k => k.startsWith(p) ? k.slice(p.length) : k);
}

async function listarGruposPublicos(){
  const keys = await rawStorageList('wsmeta:', true);
  const grupos = [];
  for(const k of keys){
    const r = await rawStorageGet(k, true);
    if(!r) continue;
    let meta; try{ meta = JSON.parse(r.value); }catch(e){ continue; }
    if(!meta.publico) continue;
    const codigo = k.slice('wsmeta:'.length);
    const temasR = await otroGrupoGet(codigo, 'config:temas', true);
    const temas = temasR ? JSON.parse(temasR.value) : [];
    let participaciones = 0, ultimaActividad = 0;
    for(const t of temas){
      const claves = await otroGrupoList(codigo, 'conversacion:' + t.id + ':', true);
      participaciones += claves.length;
      if(t.ultimaActividad && t.ultimaActividad > ultimaActividad) ultimaActividad = t.ultimaActividad;
    }
    grupos.push({ codigo, nombre: meta.nombre, creado: meta.creado, cantidadTemas: temas.length, participaciones, ultimaActividad });
  }
  return grupos;
}

async function loadTemas(){
  const r = await storageGet('config:temas', true);
  state.temas = r ? JSON.parse(r.value) : [];
}
async function saveTemas(){ await storageSet('config:temas', JSON.stringify(state.temas), true); }

async function getTemasFrescos(){
  const r = await storageGet('config:temas', true);
  return r ? JSON.parse(r.value) : [];
}
async function upsertTema(tema){
  const list = await getTemasFrescos();
  const idx = list.findIndex(x => x.id === tema.id);
  if(idx > -1) list[idx] = tema; else list.push(tema);
  await storageSet('config:temas', JSON.stringify(list), true);
  state.temas = list;
}
async function patchTema(id, patchFn){
  const list = await getTemasFrescos();
  const idx = list.findIndex(x => x.id === id);
  if(idx > -1) patchFn(list[idx]);
  await storageSet('config:temas', JSON.stringify(list), true);
  state.temas = list;
  return idx > -1 ? list[idx] : null;
}
async function removeTemaGlobal(id){
  const list = await getTemasFrescos();
  const filtered = list.filter(x => x.id !== id);
  await storageSet('config:temas', JSON.stringify(filtered), true);
  state.temas = filtered;
}

async function loadAjustes(){
  const r = await storageGet('config:ajustes', true);
  state.ajustes = r ? JSON.parse(r.value) : { permitirCrearTemas:false, requiereAprobacion:true };
}
async function saveAjustes(){ await storageSet('config:ajustes', JSON.stringify(state.ajustes), true); }

function fechaCorta(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' })
    + ' ' + d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
}

function ordenarTemas(lista, modo){
  const m = modo || 'actividad';
  return lista.slice().sort((a,b) => {
    if(!!a.fijado !== !!b.fijado) return a.fijado ? -1 : 1;
    if(m === 'participantes') return (b._count||0) - (a._count||0);
    if(m === 'creacion') return (b.creado||0) - (a.creado||0);
    return ((b._ultimaActividad || b.creado || 0) - (a._ultimaActividad || a.creado || 0));
  });
}

async function countParticipantes(temaId){
  const keys = await storageList('conversacion:' + temaId + ':', true);
  return keys.length;
}

async function cargarEncuestaEstado(){
  if(state.temaActual && state.temaActual.encuesta){
    state.encuestaResultados = await resultadosEncuesta(state.temaActual.id, state.temaActual.encuesta);
    const votoR = await storageGet('voto:' + state.temaActual.id + ':' + state.participantId, true);
    state.miVoto = votoR ? JSON.parse(votoR.value) : [];
  } else {
    state.encuestaResultados = null;
    state.miVoto = [];
  }
}

async function resultadosEncuesta(temaId, encuesta){
  const keys = await storageList('voto:' + temaId + ':', true);
  const counts = encuesta.opciones.map(() => 0);
  let totalVotantes = 0;
  for(const k of keys){
    const r = await storageGet(k, true);
    if(!r) continue;
    try{
      const sel = JSON.parse(r.value);
      const arr = Array.isArray(sel) ? sel : [sel];
      if(arr.length) totalVotantes++;
      arr.forEach(i => { if(counts[i] !== undefined) counts[i]++; });
    }catch(e){}
  }
  return { counts, totalVotantes };
}

const ACERCA_DE_RESUMEN = `Panorama IA es una herramienta de deliberación colectiva asistida por IA. Cualquier persona u organización puede crear su propio grupo ("Panorama"), con su propio link (un código único pegado al final), su propio PIN de moderador/a elegido por quien lo crea, y opcionalmente un PIN de acceso para participantes. Si el creador olvida su PIN, puede recuperarlo desde la misma cuenta de Claude con la que creó el grupo, sin necesidad de códigos extra.

Dentro de un grupo, el moderador crea "temas" (preguntas o cuestiones a deliberar) con un título y una descripción que guía a la IA; puede fijarlos arriba de la lista, pausarlos, terminarlos, editarlos o eliminarlos, y también puede permitir que los participantes propongan temas ellos mismos, con o sin aprobación previa. La lista de temas se puede buscar por texto y ordenar por actividad reciente, fecha de creación o cantidad de participantes.

Cada participante elige su nombre una sola vez por grupo (no se puede repetir con el de otra persona en el mismo grupo) y conversa en privado con una IA sobre cada tema, con sus propias palabras — la IA no opina ni influye, solo ayuda a pensar en voz alta y ordenar ideas. Esa IA puede buscar en la web si se lo piden, y también puede consultar las síntesis de los otros temas del mismo grupo si el participante pregunta si algo ya se habló en otro lado o pide un panorama general del grupo. Responde siempre en el idioma en que le escriban.

Las conversaciones de un tema se cruzan para armar una "síntesis": resumen, consensos, matices/desacuerdos, propuestas (con nombre de quién las dijo, de forma transparente como en una asamblea presencial), y cuando corresponde, un plan de acción con pasos o un cuadro comparativo de posturas opuestas. Cualquier participante puede pedir "ver el panorama del grupo" en medio de su charla para conocer y profundizar sobre lo que dijeron los demás, incluso pidiendo traducciones. Cualquiera (participe o no) puede consultar esa síntesis desde el registro público del tema, sin ser moderador.

Los temas pueden tener una encuesta opcional (una o varias opciones, no rígida: se puede cambiar el voto cuando quieras).

Un grupo puede ser público (aparece en un directorio buscable en la pantalla principal, con buscador y orden, donde cualquiera puede ver un panorama de segundo nivel —una síntesis que cruza las síntesis de todos los temas del grupo— y sumarse) o privado (solo con el link, por defecto).

async function sendToSoporte(userText){
  state.busy = true; state.error = '';
  if(!state.soporteMessages) state.soporteMessages = [];
  if(userText) state.soporteMessages.push({ role:'user', content:userText });
  render();
  try{
    if(!state.soporteId) state.soporteId = uid();
    const reply = await callClaude(state.soporteMessages.length ? state.soporteMessages : [{role:'user', content:'Hola'}], soporteSystemPrompt());
    state.soporteMessages.push({ role:'assistant', content: reply });
    await rawStorageSet('soporte:conversacion:' + state.soporteId, JSON.stringify({ messages: state.soporteMessages, ts: Date.now() }), true);
  }catch(e){
    state.error = 'No se pudo conectar con la IA. (' + e.message + ')';
  }
  state.busy = false;
  render();
}

async function generarSintesisSoporte(){
  const keys = await rawStorageList('soporte:conversacion:', true);
  let transcript = '';
  for(const k of keys){
    const r = await rawStorageGet(k, true);
    if(!r) continue;
    try{
      const c = JSON.parse(r.value);
      transcript += '\n\n--- Conversación ---\n' + c.messages.map(m => (m.role==='user'?'Visitante':'IA') + ': ' + m.content).join('\n');
    }catch(e){}
  }
  if(!transcript) return null;
  try{
    const raw = await callClaude([{ role:'user', content: 'Conversaciones de soporte a analizar:' + transcript }], soporteSintesisSystemPrompt(), null, calcularMaxTokensSintesis(transcript.length));
    const cleaned = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    await rawStorageSet('soporte:sintesis', JSON.stringify(parsed), true);
    return parsed;
  }catch(e){ return null; }
}

async function hashPin(pin){
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

  lista = lista.filter(g => g.codigo !== codigo);
  lista.unshift({ codigo, nombre });
  lista = lista.slice(0, 6);
  await rawStorageSet('mis-grupos-recientes', JSON.stringify(lista), false);
}

function slugify(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30) || 'panorama';
}

function synthGrupoSystemPrompt(nombreGrupo){
  return `Sos un asistente que arma un panorama general de un grupo llamado "${nombreGrupo}" dentro de una herramienta de deliberación colectiva. Vas a recibir las síntesis ya generadas de los distintos temas que se hablaron en este grupo. Tu tarea es identificar, mirando el conjunto: de qué se trata este grupo en general, qué ejes temáticos predominan, y qué consensos o tensiones se repiten entre varios temas (no dentro de uno solo). Mantené un tono respetuoso y riguroso, fiel a lo que cada tema realmente reflejó, sin inventar nada que no esté en las síntesis recibidas. Respondé ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin markdown, con esta forma exacta:
{"resumen":"...", "ejes_tematicos":["..."], "consensos_transversales":["..."], "temas_destacados":[{"titulo":"...","porque":"..."}]}`;
}

async function generarPanoramaGrupo(codigo, nombreGrupo){
  const temasR = await otroGrupoGet(codigo, 'config:temas', true);
  const temas = temasR ? JSON.parse(temasR.value) : [];
  let transcript = '';
  for(const t of temas){
    const s = await otroGrupoGet(codigo, 'sintesis:' + t.id, true);
    if(s){
      let parsed; try{ parsed = JSON.parse(s.value); }catch(e){ parsed = null; }
      if(parsed) transcript += `\n\n--- Tema: ${t.titulo} ---\nResumen: ${parsed.resumen||''}\nConsensos: ${(parsed.consensos||[]).map(itemTexto).join(' / ')}`;
    }
  }
  if(!transcript) return null;
  try{
    const raw = await callClaude([{ role:'user', content: 'Síntesis de los temas del grupo:' + transcript }], synthGrupoSystemPrompt(nombreGrupo), null, calcularMaxTokensSintesis(transcript.length));
    const cleaned = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    await otroGrupoSet(codigo, 'panorama-grupo', JSON.stringify(parsed), true);
    return parsed;
  }catch(e){ return null; }
}

async function nombreDisponibleEnGrupo(nombre){

/* ---------- PARTICIPANT: CHAT ---------- */
function chatSystemPrompt(){
  const t = state.temaActual;
  let p = `Estás conversando con ${state.participantName} en un espacio de deliberación colectiva, sobre este tema: "${t.titulo}".`;
  if(t.descripcion) p += ` Guía sobre qué busca este tema: ${t.descripcion}.`;
  p += ` Respondé siempre en el mismo idioma en el que te escriba el participante, sin importar en qué idioma esté redactado el título o la descripción del tema — si te escribe en inglés, portugués, o cualquier otro idioma, seguí la charla en ese idioma de ahí en más. Si todavía no escribió nada (es tu primer mensaje), arrancá en español.`;
  p += ` No sos un formulario ni una entrevista rígida de preguntas y respuestas: sostené una charla fluida y humana, como lo haría alguien que escucha con genuina atención. Tu rol es ayudar a la persona a pensar en voz alta, ordenar sus propias ideas y expresar su postura con la mayor claridad posible — no aportar tu propia opinión sobre el tema ni influir en qué debería pensar. Si la persona duda, se contradice o no encuentra las palabras, ayudala a explorarlo con preguntas abiertas o reformulando lo que dijo para ver si la interpretaste bien, en vez de simplemente pasar a la siguiente pregunta. Si te pide una opinión directa sobre el tema, podés ayudarla a pensarlo desde distintos ángulos sin tomar postura vos. Variá el ritmo: a veces una pregunta, a veces solo una reflexión breve o una devolución de lo que dijo. Tus intervenciones son cortas (2 a 4 oraciones) y con un tono cercano, nunca protocolar ni grandilocuente.

Tenés disponible una herramienta de búsqueda web. Usala cuando el participante te pida un dato, una noticia, o quiera chequear algo concreto relacionado al tema — no busques por iniciativa propia sin que aporte a la charla. Cuando busques, contá lo que encontraste con tus propias palabras, de forma breve, sin citar textualmente párrafos largos, y aclarando de dónde salió el dato si es relevante. La búsqueda es para informar mejor la conversación, no para reemplazar la perspectiva de la persona ni para que vos tomes postura con lo que encontrás.

También tenés disponible una herramienta para consultar las síntesis de los otros temas de este mismo grupo (no este). Usala cuando el participante pregunte si algo ya se habló en otro tema, si su idea se conecta con otro tema, o pida un panorama general de todo lo que se habló en el grupo hasta ahora. Si un tema todavía no tiene síntesis generada, decilo con naturalidad en vez de inventar contenido.

Este espacio busca ser una alternativa al discurso de odio, la desinformación viral y el enganche berreta de las redes sociales. Mantené siempre un tono respetuoso, calmo y riguroso; priorizá la información verificable por sobre lo sensacionalista, y si la conversación se calienta o alguien busca provocar en vez de deliberar, mantené la calma y devolvé el foco al tema con amabilidad pero sin ambigüedad.

Para tu primer mensaje (el de apertura), sé simple y concreto, sin frases genéricas tipo "pensar juntos hacia dónde vamos": en una o dos oraciones cortas saludá por su nombre y contale para qué es este espacio (que es una charla individual para recoger su mirada sobre el tema antes de ponerla en común con la del resto), y después hacé una pregunta abierta puntual que la invite a arrancar por donde quiera.

Cuando sientas que ya expresó su punto de vista con claridad, podés sugerirle amablemente que puede finalizar cuando quiera con el botón de abajo.`;
  if(state.groupContextText){
    p += `\n\nYa se le mostró a esta persona el panorama actual del grupo sobre este tema (más abajo). A partir de ahora podés hacer referencia a él con naturalidad: explicar matices, responder preguntas sobre por qué otros piensan distinto, o profundizar en una propuesta puntual —incluso si es minoritaria— con el nombre de quién la dijo, si te lo pide, para ayudarla a desarrollarla. Si te pide que traduzcas el panorama o cualquier parte de él a otro idioma, hacelo directamente. Siempre sin opinar vos mismo/a sobre qué postura es mejor.\n\nPanorama actual del grupo:\n${state.groupContextText}`;
  }
  return p;
}

async function consultarOtrosTemas(input){
  const listaTemas = (await getTemasFrescos()).filter(t => t.id !== state.temaActual.id && t.aprobado !== false);
  let candidatos = listaTemas;
  if(input && input.alcance === 'un_tema_especifico' && input.busqueda){
    const q = input.busqueda.toLowerCase();
    const filtrados = listaTemas.filter(t => (t.titulo + ' ' + (t.descripcion||'')).toLowerCase().includes(q));
    if(filtrados.length) candidatos = filtrados;
  }
  if(candidatos.length === 0) return 'No hay otros temas en este grupo todavía.';
  let out = '';
  for(const t of candidatos){
    const s = await storageGet('sintesis:' + t.id, true);
    if(s){
      let parsed; try{ parsed = JSON.parse(s.value); }catch(e){ parsed = null; }
      if(parsed){
        out += `\n\n--- Tema: ${t.titulo} ---\nResumen: ${parsed.resumen || ''}\nConsensos: ${(parsed.consensos||[]).map(itemTexto).join(' / ')}\nPropuestas: ${(parsed.propuestas||[]).map(p=>p.titulo).join(' / ')}`;
        continue;
      }
    }
    out += `\n\n--- Tema: ${t.titulo} ---\n(Todavía no tiene una síntesis generada; hay ${t._count || 0} conversaciones esperando ser sintetizadas)`;
  }
  return out;
}

const HERRAMIENTA_OTROS_TEMAS = {
  name: "consultar_otros_temas",
  description: "Consulta las síntesis de otros temas del mismo grupo de deliberación (no este). Usala cuando el participante pregunte si algo ya se habló en otro tema, si su idea se relaciona con otro tema, o pida un panorama general de todo lo que se habló en el grupo.",
  input_schema: {
    type: "object",
    properties: {
      alcance: { type: "string", enum: ["todos_los_temas", "un_tema_especifico"], description: "todos_los_temas para un panorama general del grupo; un_tema_especifico si busca algo puntual" },
      busqueda: { type: "string", description: "palabras clave del tema puntual a buscar (solo si alcance es un_tema_especifico)" }
    },
    required: ["alcance"]
  }
};

async function chatConHerramientas(mensajesIniciales, system){
  const tools = [{ type: "web_search_20250305", name: "web_search" }, HERRAMIENTA_OTROS_TEMAS];
  let mensajes = mensajesIniciales.slice();
  for(let vuelta = 0; vuelta < 4; vuelta++){
    const data = await callClaudeFull(mensajes, system, tools);
    const usosHerramienta = (data.content || []).filter(b => b.type === 'tool_use' && b.name === 'consultar_otros_temas');
    if(usosHerramienta.length === 0){
      return (data.content || []).map(b => b.text || '').join('');
    }
    mensajes.push({ role: 'assistant', content: data.content });
    const resultados = [];
    for(const tu of usosHerramienta){
      const texto = await consultarOtrosTemas(tu.input);
      resultados.push({ type: 'tool_result', tool_use_id: tu.id, content: texto });
    }
    mensajes.push({ role: 'user', content: resultados });
  }
  return 'No pude terminar de procesar tu pregunta, probá reformularla.';
}

async function sendToAI(userText){
  state.busy = true; state.error='';
  if(userText) state.messages.push({ role:'user', content:userText });
  render();
  try{
    const historialParaAPI = state.messages.filter(m => !(m.content||'').startsWith('__PANORAMA__'));
    const reply = await chatConHerramientas(historialParaAPI.length ? historialParaAPI : [{role:'user', content:'Hola'}], chatSystemPrompt());
    state.messages.push({ role:'assistant', content: reply });
    const ahora = Date.now();
    await storageSet('conversacion:' + state.temaActual.id + ':' + state.participantId, JSON.stringify({
      name: state.participantName, temaId: state.temaActual.id, messages: state.messages, finished:false, ts: ahora
    }), true);
    await patchTema(state.temaActual.id, x => { x.ultimaActividad = ahora; });
  }catch(e){
    state.error = 'No se pudo conectar con la IA. (' + e.message + ')';
  }
  state.busy = false;
  render();
}

async function verPanoramaGrupo(){
  state.busy = true; state.error=''; render();
  try{
    const s = await generarOSintesisCacheada(state.temaActual.id, false);
    if(!s){ state.error = 'Todavía no hay suficientes conversaciones para armar un panorama.'; state.busy=false; render(); return; }
    state.groupContextText = formatSynthAsText(s);
    state.messages.push({ role:'assistant', content: '__PANORAMA__' + JSON.stringify(s) });
    const ahora = Date.now();
    await storageSet('conversacion:' + state.temaActual.id + ':' + state.participantId, JSON.stringify({
      name: state.participantName, temaId: state.temaActual.id, messages: state.messages, finished:false, ts: ahora
    }), true);
    await patchTema(state.temaActual.id, x => { x.ultimaActividad = ahora; });
  }catch(e){
    state.error = 'No se pudo generar el panorama. Probá de nuevo.';
  }
  state.busy = false;
  render();
}

function formatSynthAsText(s){
  let out = 'Resumen: ' + (s.resumen||'') + '\n';
  out += 'Consensos: ' + (s.consensos||[]).map(c => itemTexto(c) + (itemNombres(c).length ? ' ('+itemNombres(c).join(', ')+')' : '')).join(' / ') + '\n';
  out += 'Matices: ' + (s.matices||[]).map(c => itemTexto(c) + (itemNombres(c).length ? ' ('+itemNombres(c).join(', ')+')' : '')).join(' / ') + '\n';
  out += 'Propuestas: ' + (s.propuestas||[]).map(p => p.titulo).join(' / ');
  return out;
}

function formatSynthAsFile(tema, s){
  let out = tema.titulo.toUpperCase() + '\n';
  if(tema.descripcion) out += tema.descripcion + '\n';
  out += '\n== RESUMEN ==\n' + (s.resumen||'') + '\n';
  out += '\n== CONSENSOS ==\n' + (s.consensos||[]).map(c => '- ' + itemTexto(c) + (itemNombres(c).length ? ' — ' + itemNombres(c).join(', ') : '')).join('\n') + '\n';
  out += '\n== MATICES Y DESACUERDOS ==\n' + (s.matices||[]).map(c => '- ' + itemTexto(c) + (itemNombres(c).length ? ' — ' + itemNombres(c).join(', ') : '')).join('\n') + '\n';
  out += '\n== PROPUESTAS ==\n' + (s.propuestas||[]).map(p => '- ' + p.titulo + ': ' + (p.descripcion||'') + ' (' + (p.participantes||[]).join(', ') + ')').join('\n');
  return out;
}

    const votos = res.counts[i] || 0;

        <option value="participantes" ${state.ordenTemas==='participantes' ? 'selected':''}>Más participantes</option>
      </select>
    </div>
    <div>${publicados.length ? publicados.map(itemHtml).join('') : '<p class="empty">Todavía no hay temas publicados.</p>'}</div>
    ${terminados.length ? `<hr class="divider" /><p class="eyebrow">Historial</p>` + terminados.map(itemHtml).join('') : ''}
    <hr class="divider" />
    <button class="btn btn-danger" id="reset-all">Borrar todos los datos del grupo</button>
  `;
  document.getElementById('back').onclick = () => { state.view='role'; render(); };
  document.getElementById('nuevo-tema').onclick = () => { state.view='mod-new-tema'; render(); };
  document.getElementById('ajuste-crear').onchange = async (e) => { state.ajustes.permitirCrearTemas = e.target.checked; await saveAjustes(); };
  document.getElementById('ajuste-aprobar').onchange = async (e) => { state.ajustes.requiereAprobacion = e.target.checked; await saveAjustes(); };
  document.getElementById('ajuste-publico').onchange = async (e) => {
    state.workspaceMeta.publico = e.target.checked;
    await rawStorageSet('wsmeta:' + state.workspaceId, JSON.stringify(state.workspaceMeta), true);
  };
  document.getElementById('orden-tema').addEventListener('change', (e) => { state.ordenTemas = e.target.value; render(); });
  document.querySelectorAll('.tema-abrir').forEach(b => b.onclick = async () => {
    state.temaActual = state.temas.find(t => t.id === b.dataset.id);
    state.editingTema = false;
    const s = await storageGet('sintesis:' + state.temaActual.id, true);
    state.synth = s ? JSON.parse(s.value) : null;
    if(state.temaActual.encuesta) state.encuestaResultados = await resultadosEncuesta(state.temaActual.id, state.temaActual.encuesta);
    else state.encuestaResultados = null;
    state.view = 'mod-tema'; render();
  });
  document.querySelectorAll('.aprobar-tema').forEach(b => b.onclick = async () => {
    await patchTema(b.dataset.id, x => { x.aprobado = true; });
    render();
  });
  document.querySelectorAll('.rechazar-tema').forEach(b => b.onclick = async () => {
    if(!confirm('¿Rechazar y eliminar este tema propuesto?')) return;
    await removeTemaGlobal(b.dataset.id);
    render();
  });
  document.getElementById('reset-all').onclick = async () => {
    if(!confirm('Esto borra TODOS los temas y conversaciones de este grupo, sin posibilidad de deshacerlo. ¿Continuar?')) return;
    const convKeys = await storageList('conversacion:', true);
    for(const k of convKeys) await storageDelete(k, true);
    const synthKeys = await storageList('sintesis:', true);
    for(const k of synthKeys) await storageDelete(k, true);
    await storageDelete('config:temas', true);
    await storageDelete('config:ajustes', true);
    state.temas = [];
    state.ajustes = { permitirCrearTemas:false, requiereAprobacion:true };
    render();
  };
}

function itemTexto(c){ return typeof c === 'string' ? c : (c.texto || ''); }
function itemNombres(c){ return typeof c === 'string' ? [] : (c.participantes || []); }

function renderEncuestaResultadosBloque(){
  const t = state.temaActual;
  if(!t.encuesta) return '';
  const enc = t.encuesta;
  const res = state.encuestaResultados || { counts: enc.opciones.map(()=>0), totalVotantes: 0 };
  const opcionesHtml = enc.opciones.map((op, i) => {
    const votos = res.counts[i] || 0;
    const pct = res.totalVotantes ? Math.round(votos / res.totalVotantes * 100) : 0;
    return `
      <div class="encuesta-opcion" style="cursor:default;">
        <span class="eo-bar" style="width:${pct}%"></span>
        <span class="eo-texto">${esc(op)}</span>
        <span class="eo-pct">${pct}% · ${votos}</span>
      </div>`;
  }).join('');
  return `
    <div class="card encuesta-card">
      <p class="eyebrow" style="margin-bottom:6px;">Resultados de la encuesta</p>
      <h4 style="font-family:'Fraunces',serif; margin:0 0 12px; font-size:17px; color:var(--ink);">${esc(enc.pregunta)}</h4>
      ${opcionesHtml}
      <p class="footer-note" style="margin-top:10px;">${res.totalVotantes} persona${res.totalVotantes===1?'':'s'} votaron.</p>
    </div>`;
}

function renderSynthesis(){
  if(!state.synth) return `<p class="empty">Todavía no se generó una síntesis para este tema.</p>`;
  const s = state.synth;
  const consensos = (s.consensos||[]).map(c => `<li>${esc(itemTexto(c))}${itemNombres(c).length ? ' <span class="names">— ' + itemNombres(c).map(esc).join(', ') + '</span>' : ''}</li>`).join('');
  const matices = (s.matices||[]).map(c => `<li>${esc(itemTexto(c))}${itemNombres(c).length ? ' <span class="names">— ' + itemNombres(c).map(esc).join(', ') + '</span>' : ''}</li>`).join('');
  const propuestas = (s.propuestas||[]).map(p => `
    <div class="proposal">
      <div class="t">${esc(p.titulo||'')}</div>
      <div>${esc(p.descripcion||'')}</div>

  const pasosHtml = (s.pasos||[]).length ? `
    <div class="synth-block">
      <h3>Plan de acción</h3>

  const comparacionHtml = (s.comparacion||[]).length >= 2 ? `
    <div class="synth-block">
      <h3>Posturas enfrentadas</h3>
      <div class="cmp-wrap"><table class="cmp-table">

      </table></div>
    </div>` : '';
  return `
    <div class="synth-block"><h3>Resumen</h3><p>${esc(s.resumen||'')}</p></div>
    <div class="synth-block"><h3>Consensos</h3><ul>${consensos || '<li class="empty">Sin datos suficientes todavía.</li>'}</ul></div>
    <div class="synth-block"><h3>Matices y desacuerdos</h3><ul>${matices || '<li class="empty">Sin datos suficientes todavía.</li>'}</ul></div>
    ${comparacionHtml}
    <div class="synth-block"><h3>Propuestas</h3>${propuestas || '<p class="empty">Sin datos suficientes todavía.</p>'}</div>
    ${pasosHtml}

function synthSystemPrompt(tema){
  return `Sos un asistente que sintetiza deliberaciones colectivas de un grupo (puede ser una asamblea, cooperativa, consorcio, club, fundación, equipo de trabajo u organización de cualquier tipo), sobre el tema: "${tema.titulo}"${tema.descripcion ? ' (' + tema.descripcion + ')' : ''}. Vas a recibir las transcripciones de conversaciones individuales de distintos participantes. Este espacio funciona con transparencia, como una reunión presencial: las propuestas puntuales, distintas o minoritarias siempre deben indicar qué participante o participantes las expresaron, sin importar cuánta gente haya participado en total — esa atribución es la que le permite a otros profundizar sobre esa idea puntual después. Para los consensos amplios, usá criterio según la escala: si son pocos participantes, nombralos; si son muchos y el consenso es compartido por la mayoría, describilo como patrón (por ejemplo "compartido por la mayoría" o un número aproximado) en vez de listar todos los nombres uno por uno. Este espacio busca ser una alternativa al discurso de odio, la desinformación viral y el enganche berreta de las redes sociales: redactá la síntesis con un tono respetuoso, calmo y riguroso, priorizando la fidelidad a lo que cada participante dijo por sobre cualquier formulación sensacionalista. Si de las conversaciones surgió un plan de acción concreto o una secuencia de pasos a seguir (por ejemplo, para organizar un encuentro, ejecutar una propuesta, o avanzar en el tema), incluilo en "pasos" como una lista ordenada de acciones breves, una por elemento — sin inventar pasos que nadie mencionó. Si no surgió nada así, dejá esa lista vacía. Si existen posturas realmente opuestas o diferencias marcadas y generalizadas entre participantes (no simples matices o variantes de una misma idea, sino posiciones que se contraponen entre sí de forma clara), identificalas en "comparacion" como una lista de posturas, cada una con "titulo" (nombre breve de la postura), "descripcion" y "participantes" que la sostienen. Esto es para poder mostrarlas una al lado de la otra en un cuadro comparativo — usalo solo cuando la oposición sea genuina y clara, no la fuerces si en el fondo hay más coincidencia que diferencia. Respondé ÚNICAMENTE con un objeto JSON válido, sin texto adicional, sin markdown, con esta forma exacta:
{"resumen":"...", "consensos":[{"texto":"...","participantes":["..."]}], "matices":[{"texto":"...","participantes":["..."]}], "propuestas":[{"titulo":"...","descripcion":"...","participantes":["..."]}], "pasos":["..."], "comparacion":[{"titulo":"...","descripcion":"...","participantes":["..."]}]}`;
}

async function generarOSintesisCacheada(temaId, forzarNueva){
  const tema = state.temas.find(x => x.id === temaId) || state.temaActual;
  const keys = await storageList('conversacion:' + temaId + ':', true);
  if(keys.length === 0) return null;
  let transcript = '';
  for(const k of keys){
    const r = await storageGet(k, true);
    if(!r) continue;
    const conv = JSON.parse(r.value);
    transcript += `\n\n--- Participante: ${conv.name} ---\n`;
    transcript += conv.messages.filter(m => !(m.content||'').startsWith('__PANORAMA__'))
      .map(m => (m.role==='user' ? conv.name : 'Entrevistador') + ': ' + m.content).join('\n');
  }
  try{
    const raw = await callClaude([{ role:'user', content: 'Transcripciones a analizar:' + transcript }], synthSystemPrompt(tema), null, calcularMaxTokensSintesis(transcript.length));
    const cleaned = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    await storageSet('sintesis:' + temaId, JSON.stringify(parsed), true);
    return parsed;
  }catch(e){
    return null;
  }
}

async function boot(){
  const codigo = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
  if(codigo){
    const meta = await rawStorageGet('wsmeta:' + codigo, true);
    if(meta){
      state.workspaceId = codigo;
      state.workspaceMeta = JSON.parse(meta.value);
      state.view = 'role';
    } else {
      state.errorLanding = 'No encontramos un Panorama con ese código. Revisá el link o creá uno nuevo.';
      state.view = 'landing';
    }
  } else {
    state.view = 'landing';
  }
  render();
}
boot();
