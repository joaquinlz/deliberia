function tr(key){
  const entry = I18N[key];
  if(!entry) return key;
  return entry[state.lang] || entry.es || '';
}

function trEstado(estado){
  return tr('estado' + estado.charAt(0).toUpperCase() + estado.slice(1));
}

function plural(n, esUno, esVarios, enUno, enVarios){
  const palabra = state.lang === 'en' ? (n === 1 ? enUno : enVarios) : (n === 1 ? esUno : esVarios);
  return n + ' ' + palabra;
}

// "N persona(s) votaron[ sufijo]." / "N person voted / people voted[ suffix]."
function personasVotaron(n, sufijoEs, sufijoEn){
  if(state.lang === 'en'){
    return n + ' ' + (n===1 ? 'person voted' : 'people voted') + (sufijoEn ? ' ' + sufijoEn : '') + '.';
  }
  return n + ' persona' + (n===1?'':'s') + (n===1?' votó':' votaron') + (sufijoEs ? ' ' + sufijoEs : '') + '.';
}

function votosTexto(n){
  return plural(n, 'voto', 'votos', 'vote', 'votes');
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function mensajeErrorIA(e){
  const msg = (e && e.message) || '';
  if(msg.includes('429') || msg.includes('exceeded_limit')){
    return tr('errorLimiteUso');
  }
  return tr('errorConexionIA');
}

async function descargarWordBlob(html, nombreArchivo, okElId, errElId){
  const okEl = okElId ? document.getElementById(okElId) : null;
  const errEl = errElId ? document.getElementById(errElId) : null;
  if(errEl) errEl.textContent = '';
  if(okEl) okEl.textContent = '';
  try{
    const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
    if(navigator.share && navigator.canShare){
      const file = new File([blob], nombreArchivo, { type: 'application/msword' });
      if(navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file] });
        if(okEl) okEl.textContent = tr('modTemaDescargaIniciada');
        return;
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if(okEl) okEl.textContent = tr('modTemaDescargaIniciada');
  }catch(e){
    if(e && e.name === 'AbortError') return;
    if(errEl) errEl.textContent = tr('noSePudoDescargar');
  }
}

function armarConfirmacionDobleToque(btn, accionConfirmada){
  if(!btn) return;
  let confirmando = false;
  let temporizador = null;
  const textoOriginal = btn.textContent;
  const teniaDangerOriginal = btn.classList.contains('btn-danger');
  btn.onclick = async () => {
    if(!confirmando){
      confirmando = true;
      btn.textContent = tr('confirmarTocaDeNuevo');
      btn.classList.add('btn-danger');
      temporizador = setTimeout(() => {
        confirmando = false;
        btn.textContent = textoOriginal;
        if(!teniaDangerOriginal) btn.classList.remove('btn-danger');
      }, 4000);
      return;
    }
    clearTimeout(temporizador);
    confirmando = false;
    await accionConfirmada();
  };
}

/* Reemplazo de window.storage (exclusivo del sandbox de claude.ai) por localStorage para todo
   lo "privado" (shared=false: por navegador/dispositivo — idioma, grupos recientes, perfil,
   identidad de moderador). Los datos compartidos entre participantes (shared=true) ya NO
   pasan por acá: cada función que los necesita llama directo a la API del backend. */
async function rawStorageGet(key, shared){
  if(!shared){
    try{ const v = localStorage.getItem('deliberia:' + key); return v === null ? null : { value: v }; }catch(e){ return null; }
  }
  console.warn('rawStorageGet(shared=true) sin migrar a la API:', key);
  return null;
}
async function rawStorageSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem('deliberia:' + key, value); return true; }catch(e){ return null; }
  }
  console.warn('rawStorageSet(shared=true) sin migrar a la API:', key);
  return null;
}
async function rawStorageList(prefix, shared){
  if(!shared){
    try{
      const out = [];
      const p = 'deliberia:' + prefix;
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(p)) out.push(k.slice('deliberia:'.length));
      }
      return out;
    }catch(e){ return []; }
  }
  console.warn('rawStorageList(shared=true) sin migrar a la API:', prefix);
  return [];
}
async function rawStorageDelete(key, shared){
  if(!shared){
    try{ localStorage.removeItem('deliberia:' + key); }catch(e){}
    return;
  }
  console.warn('rawStorageDelete(shared=true) sin migrar a la API:', key);
}

async function api(path, options){
  try{
    const res = await fetch(API_BASE + path, options);
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok) return { error: (data && data.error) || ('api_error_' + res.status) };
    return data;
  }catch(e){
    return { error: 'api_error_conexion' };
  }
}

}

// Para operaciones largas (síntesis, panorama de grupo) el backend devuelve la respuesta
// de la IA en vivo (streaming), no todo junto al final. Esta función va leyendo esos
// fragmentos a medida que llegan, junta solo el contenido real (nunca el "pensamiento
// interno" del modelo, que viaja por separado) y llama a onProgress con la cantidad de
// caracteres recibidos hasta el momento, para poder animar una barra de progreso.
async function streamPost(path, onProgress, body){
  let res;
  try{
    res = await fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  }catch(e){
    return { error: 'api_error_conexion' };
  }
  if(!res.ok){
    let data = null;
    try{ data = await res.json(); }catch(e){}
    return { error: (data && data.error) || ('api_error_' + res.status) };
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let texto = '';
  let totalChars = 0;
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, { stream: true });
    const lineas = buffer.split('\n');
    buffer = lineas.pop();
    for(const linea of lineas){
      if(!linea.startsWith('data: ')) continue;
      const dataStr = linea.slice(6).trim();
      if(!dataStr || dataStr === '[DONE]') continue;
      try{
        const evt = JSON.parse(dataStr);
        const delta = evt.choices && evt.choices[0] && evt.choices[0].delta;
        if(delta){
          if(delta.content) texto += delta.content;
          totalChars += (delta.content ? delta.content.length : 0) + (delta.reasoning ? delta.reasoning.length : 0);
          if(onProgress) onProgress(totalChars);
        }
      }catch(e){}
    }
  }
  try{
    const limpio = texto.replace(/```json|```/g, '').trim();
    return JSON.parse(limpio);
  }catch(e){
    return { error: 'La IA no devolvió un resultado válido. Probá de nuevo.' };
  }
}

/* Todas las claves de datos de un espacio quedan prefijadas automáticamente con su código,
   así el resto del código (temas, conversaciones, síntesis, perfiles) no necesita saber
   que existen múltiples espacios aislados: solo opera "dentro" del suyo. */
function wsPrefix(){ return 'ws:' + (state.workspaceId || 'default') + ':'; }
async function storageGet(key, shared){ return rawStorageGet(wsPrefix() + key, shared); }
async function storageSet(key, value, shared){ return rawStorageSet(wsPrefix() + key, value, shared); }
async function storageList(prefix, shared){
  const keys = await rawStorageList(wsPrefix() + prefix, shared);
  const p = wsPrefix();
  return keys.map(k => k.startsWith(p) ? k.slice(p.length) : k);
}
async function storageDelete(key, shared){ return rawStorageDelete(wsPrefix() + key, shared); }

function textoTemaSync(t){
  if(t.traducciones && t.traducciones[state.lang]) return t.traducciones[state.lang];
  return { titulo: t.titulo, descripcion: t.descripcion || '' };
}

function encuestaTraducida(t){
  if(!t.encuesta) return null;
  if(t.traducciones && t.traducciones[state.lang] && t.traducciones[state.lang].encuesta) return t.traducciones[state.lang].encuesta;
  return t.encuesta;
}

async function traducirTemaConIA(temaId, idiomaDestino){
  const resultado = await apiPost('/grupos/' + state.workspaceId + '/temas/' + temaId + '/traducir', { idioma: idiomaDestino });
  if(!resultado || resultado.error) return null;
  return resultado;
}

async function asegurarTraduccionesTemas(temas){
  for(const t of temas){
    if(t.traducciones && t.traducciones[state.lang]) continue;
    const trad = await traducirTemaConIA(t.id, state.lang);
    if(!trad) continue;
    if(!t.traducciones) t.traducciones = {};
    t.traducciones[state.lang] = trad;
    const elTitulo = document.querySelector(`[data-tema-titulo="${t.id}"]`);
    const elDesc = document.querySelector(`[data-tema-desc="${t.id}"]`);
    if(elTitulo) elTitulo.textContent = trad.titulo;
    if(elDesc) elDesc.textContent = trad.descripcion;
    if(t.encuesta && state.temaActual && state.temaActual.id === t.id){
      const wrap = document.getElementById('encuesta-widget-wrap');
      if(wrap){ wrap.innerHTML = renderEncuestaWidget(); conectarVotosEncuesta(); }
    }
  }
}

async function patchTema(id, body){
  const actualizado = await apiPost('/grupos/' + state.workspaceId + '/temas/' + id, { ...body, pin: state.moderatorPin });
  if(!actualizado || actualizado.error) return null;
  const idx = state.temas.findIndex(x => x.id === id);
  if(idx > -1) state.temas[idx] = { ...state.temas[idx], ...actualizado };
  if(state.temaActual && state.temaActual.id === id) state.temaActual = { ...state.temaActual, ...actualizado };
  return actualizado;
}

async function eliminarTemaBackend(id){
  await apiPost('/grupos/' + state.workspaceId + '/temas/' + id + '/eliminar', { pin: state.moderatorPin });

}

function fechaCorta(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const locale = state.lang === 'en' ? 'en-US' : 'es-AR';
  return d.toLocaleDateString(locale, { day:'2-digit', month:'2-digit', year:'numeric' })
    + ' ' + d.toLocaleTimeString(locale, { hour:'2-digit', minute:'2-digit' });
}

function ordenarTemas(lista, modo){
  const m = modo || 'actividad';
  return lista.slice().sort((a,b) => {
    if(!!a.fijado !== !!b.fijado) return a.fijado ? -1 : 1;
    if(m === 'participantes') return (b._count||0) - (a._count||0);
    if(m === 'creacion') return (b.creado||0) - (a.creado||0);
    return ((b._ultimaActividad || b.creado || 0) - (a._ultimaActividad || a.creado || 0));
  });
}

async function cargarEncuestaEstado(){

    const miVotoR = await apiGet('/grupos/' + state.workspaceId + '/temas/' + state.temaActual.id + '/votos?participanteId=' + encodeURIComponent(state.participantId));
    state.miVoto = (miVotoR && Array.isArray(miVotoR.opciones)) ? miVotoR.opciones : [];
  } else {

  }
}

async function sendToSoporte(userText){
  state.busy = true; state.error = '';
  if(!state.soporteMessages) state.soporteMessages = [];
  if(userText) state.soporteMessages.push({ role:'user', content:userText });
  render();
  try{
    if(!state.soporteId) state.soporteId = uid();
    const resultado = await apiPost('/soporte/mensajes', { sesionId: state.soporteId, mensaje: userText || '', lang: state.lang });
    if(resultado.error) throw new Error(resultado.error);
    state.soporteMessages.push({ role:'assistant', content: resultado.respuesta });
  }catch(e){
    state.error = mensajeErrorIA(e);
  }
  state.busy = false;
  render();
}

function renderSoporteChat(){
  const log = (state.soporteMessages||[]).map(m => `<div class="msg ${m.role==='user'?'user':'ai'}">${esc(m.content)}</div>`).join('');
  app.innerHTML = `
    <a class="back" id="back">${tr('volver')}</a>
    <p class="eyebrow" style="margin-top:18px;">${tr('soporteEyebrow')}</p>

      <div class="chat-log" id="log">
        ${log}
        ${state.busy ? `<div class="msg ai typing">${tr('escribiendo')}</div>` : ''}
      </div>
      <div class="chat-input-row">
        <textarea id="msg-input" placeholder="${tr('soportePlaceholder')}" maxlength="4000" ${state.busy?'disabled':''}></textarea>

async function agregarGrupoReciente(codigo, nombre){
  let lista = [];
  try{
    const r = await rawStorageGet('mis-grupos-recientes', false);
    if(r) lista = JSON.parse(r.value);
  }catch(e){}
  lista = lista.filter(g => g.codigo !== codigo);
  lista.unshift({ codigo, nombre });
  lista = lista.slice(0, 6);
  await rawStorageSet('mis-grupos-recientes', JSON.stringify(lista), false);
}

async function obtenerGruposRecientes(){
  try{
    const r = await rawStorageGet('mis-grupos-recientes', false);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}

function slugify(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30) || 'panorama';
}

function pintarDirectorio(){
  const cont = document.getElementById('lista-directorio');
  if(!cont) return;
  const filtro = (state.filtroDirectorio || '').toLowerCase();
  let lista = (state.directorioGrupos || []).filter(g => !filtro || g.nombre.toLowerCase().includes(filtro));
  const orden = state.ordenDirectorio || 'actividad';
  lista = lista.slice().sort((a,b) => {
    if(orden === 'participantes') return b.participaciones - a.participaciones;
    if(orden === 'creacion') return (b.creado||0) - (a.creado||0);
    return (b.ultimaActividad||b.creado||0) - (a.ultimaActividad||a.creado||0);
  });
  const limiteDirectorio = state.mostrarDirectorioHasta || 20;
  const listaVisible = lista.slice(0, limiteDirectorio);
  const items = listaVisible.length ? listaVisible.map(g => `
    <div class="tema-item" data-codigo="${esc(g.codigo)}">
      <div class="row1"><h4>${esc(g.nombre)}</h4></div>
      <div class="meta">
        <span>${plural(g.cantidadTemas, 'tema', 'temas', 'topic', 'topics')}</span>
        <span>${g.participaciones} ${tr('dirParticipaciones')}</span>
        ${g.ultimaActividad ? `<span>${tr('dirUltimaActividad')}${fechaCorta(g.ultimaActividad)}</span>` : ''}
        <span>${tr('dirCreado')}${fechaCorta(g.creado)}</span>
      </div>
      <div class="tema-actions" style="margin-top:12px;">
        <button class="btn btn-primary btn-sm dir-unirse" data-codigo="${esc(g.codigo)}">${tr('dirUnirme')}</button>
        <button class="btn btn-ghost btn-sm dir-panorama" data-codigo="${esc(g.codigo)}">${tr('dirVerPanorama')}</button>
      </div>
    </div>`).join('') : `<p class="empty">${(state.directorioGrupos||[]).length ? tr('dirSinCoincidencias') : tr('dirSinGrupos')}</p>`;
  const verMasDirHtml = lista.length > limiteDirectorio ? `<button class="btn btn-ghost btn-sm" id="ver-mas-directorio" style="margin-top:12px;">${tr('verMas')} (${lista.length - limiteDirectorio})</button>` : '';
  cont.innerHTML = `
    <div class="field">
      <input type="text" id="buscar-directorio" placeholder="${tr('dirBuscarPlaceholder')}" value="${esc(state.filtroDirectorio||'')}" maxlength="100" />
    </div>
    <div class="field">
      <label for="orden-directorio">${tr('ordenarPor')}</label>
      <select id="orden-directorio" class="select-orden">
        <option value="actividad" ${orden==='actividad'?'selected':''}>${tr('ordenActividad')}</option>
        <option value="creacion" ${orden==='creacion'?'selected':''}>${tr('ordenCreacion')}</option>
        <option value="participantes" ${orden==='participantes'?'selected':''}>${tr('ordenParticipaciones')}</option>
      </select>
    </div>
    <div>${items}</div>
    ${verMasDirHtml}
  `;
  const buscar = document.getElementById('buscar-directorio');
  buscar.addEventListener('input', () => { state.filtroDirectorio = buscar.value; state.mostrarDirectorioHasta = null; pintarDirectorio(); setTimeout(()=>{ const el=document.getElementById('buscar-directorio'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} },0); });
  document.getElementById('orden-directorio').addEventListener('change', (e) => { state.ordenDirectorio = e.target.value; state.mostrarDirectorioHasta = null; pintarDirectorio(); });
  const verMasDirBtn = document.getElementById('ver-mas-directorio');
  if(verMasDirBtn) verMasDirBtn.onclick = () => { state.mostrarDirectorioHasta = limiteDirectorio + 20; pintarDirectorio(); };
  document.querySelectorAll('.dir-unirse').forEach(b => b.onclick = async () => {
    const codigo = b.dataset.codigo;
    const meta = await apiGet('/grupos/' + encodeURIComponent(codigo));
    if(!meta || meta.error) return;
    state.workspaceId = codigo;
    state.workspaceMeta = meta;
    await agregarGrupoReciente(codigo, state.workspaceMeta.nombre);
    state.view = 'role'; render();
  });
  document.querySelectorAll('.dir-panorama').forEach(b => b.onclick = () => {

    state.origenPanoramaGrupo = 'directorio-grupos';
    state.view = 'panorama-grupo-publico'; render();
  });
}

      turnstileWidgetId = window.turnstile.render('#ce-turnstile', { sitekey: TURNSTILE_SITE_KEY });
    } else if((intentos || 0) < 50){
      setTimeout(() => montarTurnstile((intentos || 0) + 1), 200);

  })();

    const nombre = document.getElementById('ce-nombre').value.trim();

    const btnCrear = document.getElementById('ce-crear');
    btnCrear.disabled = true;
    const publico = document.getElementById('ce-publico').checked;
    const resultado = await apiPost('/grupos', { nombre, pin, pinAcceso, publico, turnstileToken });
    if(resultado.error){
      document.getElementById('ce-err').textContent = resultado.error === 'Ya existe un grupo con ese nombre.' ? tr('crearNombreEnUso') : resultado.error;
      btnCrear.disabled = false;

    state.workspaceId = resultado.codigo;
    state.workspaceMeta = resultado;
    state.pinPlano = pin;
    state.pinAccesoPlano = pinAcceso || '';
    await storageSet('creador', 'true', false);

    state.view = 'espacio-creado'; render();

}

function renderParticipantTopics(){
  const visibles = ordenarTemas(state.temas.filter(t => t.aprobado !== false), state.ordenTemas);
  const filtro = (state.filtroTemas || '').toLowerCase();
  const filtrados = filtro ? visibles.filter(t => (t.titulo+' '+(t.descripcion||'')).toLowerCase().includes(filtro)) : visibles;
  const limiteTemas = state.mostrarTemasHasta || 20;
  const visiblesAhora = filtrados.slice(0, limiteTemas);
  const items = visiblesAhora.length ? visiblesAhora.map(t => {
    const disabled = t.estado !== 'activo';
    const txt = textoTemaSync(t);
    const origenBadge = t.creadoPor === 'participante'
      ? `<span class="badge comunidad">${tr('pTopicsPropuestoPor')}${esc(t.creadorNombre || tr('pTopicsUnParticipante'))}</span>`
      : `<span class="badge oficial">${tr('pTopicsOficial')}</span>`;
    return `
      <div class="tema-item ${disabled ? 'disabled':''}" data-id="${esc(t.id)}">
        <div class="row1">
          <h4>${t.fijado ? '📌 ' : ''}<span data-tema-titulo="${esc(t.id)}">${esc(txt.titulo)}</span></h4>
          <span class="badge ${t.estado}">${trEstado(t.estado)}</span>
        </div>
        <p class="desc" data-tema-desc="${esc(t.id)}">${esc(txt.descripcion)}</p>
        <div class="meta">
          ${origenBadge}
          <span>${tr('pTopicsCreado')}${fechaCorta(t.creado)}</span>
          ${t._ultimaActividad ? `<span>${tr('pTopicsUltimaActividad')}${fechaCorta(t._ultimaActividad)}</span>` : ''}
          <span>${t._count || 0} ${tr('pTopicsParticiparon')}</span>
          ${disabled ? `<span>${tr('pTopicsNoAdmite')}</span>` : ''}
        </div>
        <div class="tema-actions" style="margin-top:12px;">
          ${!disabled ? `<button class="btn btn-primary btn-sm tema-enter" data-id="${esc(t.id)}">${tr('pTopicsEntrar')}</button>` : ''}
          <button class="btn btn-ghost btn-sm tema-registro" data-id="${esc(t.id)}">${tr('pTopicsVerPanorama')}</button>
        </div>
      </div>`;
  }).join('') : `<p class="empty">${state.temas.length ? tr('pTopicsSinCoincidencias') : tr('pTopicsSinTemas')}</p>`;
  const verMasHtml = filtrados.length > limiteTemas ? `<button class="btn btn-ghost btn-sm" id="ver-mas-temas" style="margin-top:12px;">${tr('verMas')} (${filtrados.length - limiteTemas})</button>` : '';

  app.innerHTML = `
    <a class="back" id="back">${tr('volver')}</a>
    <p class="eyebrow" style="margin-top:18px;">${tr('pTopicsEyebrow')}</p>
    <h1>${tr('pTopicsTitulo')}</h1>
    <button class="btn btn-ghost btn-sm" id="ver-panorama-grupo-desde-temas" style="margin-bottom:16px;">${tr('pTopicsVerPanoramaGrupo')}</button>
    <div class="field">
      <input type="text" id="buscar-tema" placeholder="${tr('pTopicsBuscar')}" value="${esc(state.filtroTemas||'')}" maxlength="100" />
    </div>
    <div class="field">
      <label for="orden-tema">${tr('ordenarPor')}</label>
      <select id="orden-tema" class="select-orden">
        <option value="actividad" ${(!state.ordenTemas || state.ordenTemas==='actividad') ? 'selected':''}>${tr('ordenActividad')}</option>
        <option value="creacion" ${state.ordenTemas==='creacion' ? 'selected':''}>${tr('ordenCreacion')}</option>
        <option value="participantes" ${state.ordenTemas==='participantes' ? 'selected':''}>${tr('ordenParticipantes')}</option>
      </select>
    </div>
    ${state.workspaceMeta && state.workspaceMeta.permitirCrearTemas ? `<button class="btn btn-teal btn-sm" id="proponer-tema" style="margin-bottom:20px;">${tr('pTopicsProponer')}</button>` : ''}
    <div>${items}</div>
    ${verMasHtml}
  `;
  document.getElementById('back').onclick = () => { state.view='role'; render(); };
  const buscar = document.getElementById('buscar-tema');
  buscar.addEventListener('input', () => { state.filtroTemas = buscar.value; state.mostrarTemasHasta = null; renderParticipantTopics(); setTimeout(()=>{ const el=document.getElementById('buscar-tema'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} },0); });
  document.getElementById('orden-tema').addEventListener('change', (e) => { state.ordenTemas = e.target.value; state.mostrarTemasHasta = null; renderParticipantTopics(); });
  const verMasBtn = document.getElementById('ver-mas-temas');
  if(verMasBtn) verMasBtn.onclick = () => { state.mostrarTemasHasta = limiteTemas + 20; renderParticipantTopics(); };
  const proponer = document.getElementById('proponer-tema');
  if(proponer) proponer.onclick = () => { state.view = 'p-nuevo-tema'; render(); };
  document.getElementById('ver-panorama-grupo-desde-temas').onclick = () => {
    const participaciones = state.temas.reduce((acc, t) => acc + (t._count || 0), 0);
    state.grupoPublicoActual = {
      codigo: state.workspaceId,
      nombre: state.workspaceMeta.nombre,
      cantidadTemas: state.temas.length,
      participaciones
    };
    state.origenPanoramaGrupo = 'p-topics';
    state.view = 'panorama-grupo-publico'; render();
  };
  asegurarTraduccionesTemas(visiblesAhora);
  document.querySelectorAll('.tema-enter').forEach(b => b.onclick = async () => {
    const tema = state.temas.find(t => t.id === b.dataset.id);
    state.temaActual = tema;
    state.groupContextText = '';
    state.error = '';
    state.participantName = state.savedName;
    const mensajes = await apiGet('/grupos/' + state.workspaceId + '/temas/' + tema.id + '/mensajes?participanteId=' + encodeURIComponent(state.participantId));
    state.messages = Array.isArray(mensajes) ? mensajes : [];
    state.resumed = state.messages.length > 0;
    await cargarEncuestaEstado();
    state.view = 'p-chat'; render();
    if(state.messages.length === 0) await sendToAI(null);
  });
  document.querySelectorAll('.tema-registro').forEach(b => b.onclick = async () => {
    const tema = state.temas.find(t => t.id === b.dataset.id);
    state.temaActual = tema;
    state.error = '';
    const s = await apiPost('/grupos/' + state.workspaceId + '/temas/' + tema.id + '/sintesis/traducir', { idioma: state.lang });
    state.synth = (s && !s.error) ? s : null;
    if(tema.encuesta){
      const res = await apiGet('/grupos/' + state.workspaceId + '/temas/' + tema.id + '/votos/resultados');
      state.encuestaResultados = (res && !res.error) ? res : null;
    } else state.encuestaResultados = null;
    state.view = 'p-registro'; render();
  });
}

    <div id="synth-area">${renderSynthesis()}</div>

  document.getElementById('gen-synth').onclick = async () => {
    state.busy = true; state.error=''; render();
    // El total real de caracteres varía según cuánto "piensa" el modelo antes de
    // responder — esto es solo una referencia aproximada para animar la barra,
    // no una medición exacta.
    const presupuestoAprox = 12000;
    const s = await streamPost('/grupos/' + state.workspaceId + '/temas/' + t.id + '/sintesis', (chars) => {
      actualizarBarraProgreso('progreso-synth', (chars / presupuestoAprox) * 100);

    if(s.error) state.error = s.error === 'Todavía no hay conversaciones en este tema.' ? tr('pChatSinConversaciones') : tr('errorGeneracion');

    state.busy = false; render();

  const downloadBtn = document.getElementById('download-synth');

    const nombre = 'sintesis_' + t.titulo.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,40) + '.doc';
    descargarWordBlob(html, nombre, 'mod-ok', 'mod-err');
  };
}

async function sendToAI(userText){
  state.busy = true; state.error='';
  if(userText) state.messages.push({ role:'user', content:userText });
  const herramienta = state.modoHerramienta || null;
  state.modoHerramienta = null;
  render();
  try{
    const resultado = await apiPost(
      '/grupos/' + state.workspaceId + '/temas/' + state.temaActual.id + '/mensajes',
      { participanteId: state.participantId, mensaje: userText || '', herramienta, lang: state.lang }
    );
    if(resultado.error) throw new Error(resultado.error);
    state.messages.push({ role:'assistant', content: resultado.respuesta });
  }catch(e){
    state.error = mensajeErrorIA(e);
  }
  state.busy = false;
  render();
}

function formatSynthAsWordHtml(tema, s){
  const li = (c) => `<li>${esc(itemTexto(c))}${itemNombres(c).length ? ' <i>— ' + itemNombres(c).map(esc).join(', ') + '</i>' : ''}</li>`;
  const propHtml = (s.propuestas||[]).map(p => `<li><b>${esc(p.titulo || '')}:</b> ${esc(p.descripcion || '')} <i>— ${(p.participantes||[]).map(esc).join(', ')}</i></li>`).join('');
  let encuestaHtml = '';
  if(tema.encuesta && state.encuestaResultados){
    const res = state.encuestaResultados;
    const filas = tema.encuesta.opciones.map((op, i) => {
      const votos = res.counts[i] || 0;
      const pct = res.totalVotantes ? Math.round(votos / res.totalVotantes * 100) : 0;
      return `<li>${esc(op)}: ${pct}% (${votosTexto(votos)})</li>`;
    }).join('');
    encuestaHtml = `<h2 style="color:#9C7A3C;">${tr('synthEncuesta')}${esc(tema.encuesta.pregunta)}</h2><ul>${filas}</ul><p><i>${personasVotaron(res.totalVotantes)}</i></p>`;
  }
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${esc(tema.titulo)}</title></head>
<body style="font-family:Calibri,Arial,sans-serif; text-align:justify;">
<h1 style="color:#1F3B57;">${esc(tema.titulo)}</h1>
${tema.descripcion ? `<p><i>${esc(tema.descripcion)}</i></p>` : ''}
<h2 style="color:#9C7A3C;">${tr('resumen')}</h2><p>${esc(s.resumen || '')}</p>
<h2 style="color:#9C7A3C;">${tr('synthConsensos')}</h2><ul>${(s.consensos||[]).map(li).join('') || `<li>${tr('sinDatos')}</li>`}</ul>
<h2 style="color:#9C7A3C;">${tr('synthMaticesDesacuerdos')}</h2><ul>${(s.matices||[]).map(li).join('') || `<li>${tr('sinDatos')}</li>`}</ul>
<h2 style="color:#9C7A3C;">${tr('synthPropuestas')}</h2><ul>${propHtml || `<li>${tr('sinDatos')}</li>`}</ul>
${(s.comparacion||[]).length >= 2 ? `<h2 style="color:#9C7A3C;">${tr('synthPosturasEnfrentadas')}</h2><table border="1" cellpadding="6" style="border-collapse:collapse;"><tr><td></td>${s.comparacion.map(c=>`<td><b>${esc(c.titulo||'')}</b></td>`).join('')}</tr><tr><td>${tr('synthPostura')}</td>${s.comparacion.map(c=>`<td>${esc(c.descripcion||'')}</td>`).join('')}</tr><tr><td>${tr('synthSostenidaPor')}</td>${s.comparacion.map(c=>`<td>${(c.participantes||[]).map(esc).join(', ')}</td>`).join('')}</tr></table>` : ''}
${(s.pasos||[]).length ? `<h2 style="color:#9C7A3C;">${tr('synthPlanAccion')}</h2><ol>${s.pasos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>` : ''}
${encuestaHtml}
</body></html>`;
}

function formatSynthAsText(s){
  let out = 'Resumen: ' + (s.resumen||'') + '\n';
  out += 'Consensos: ' + (s.consensos||[]).map(c => itemTexto(c) + (itemNombres(c).length ? ' ('+itemNombres(c).join(', ')+')' : '')).join(' / ') + '\n';
  out += 'Matices: ' + (s.matices||[]).map(c => itemTexto(c) + (itemNombres(c).length ? ' ('+itemNombres(c).join(', ')+')' : '')).join(' / ') + '\n';
  out += 'Propuestas: ' + (s.propuestas||[]).map(p => p.titulo).join(' / ');
  return out;
}

function formatSynthAsFile(tema, s){
  let out = tema.titulo.toUpperCase() + '\n';
  if(tema.descripcion) out += tema.descripcion + '\n';
  out += '\n== RESUMEN ==\n' + (s.resumen||'') + '\n';
  out += '\n== CONSENSOS ==\n' + (s.consensos||[]).map(c => '- ' + itemTexto(c) + (itemNombres(c).length ? ' — ' + itemNombres(c).join(', ') : '')).join('\n') + '\n';
  out += '\n== MATICES Y DESACUERDOS ==\n' + (s.matices||[]).map(c => '- ' + itemTexto(c) + (itemNombres(c).length ? ' — ' + itemNombres(c).join(', ') : '')).join('\n') + '\n';
  out += '\n== PROPUESTAS ==\n' + (s.propuestas||[]).map(p => '- ' + p.titulo + ': ' + (p.descripcion||'') + ' (' + (p.participantes||[]).join(', ') + ')').join('\n');
  return out;
}

function renderMsgContent(m){
  if(m.role === 'assistant' && m.content.startsWith('__PANORAMA__')){
    try{
      const s = JSON.parse(m.content.slice('__PANORAMA__'.length));
      const consensos = (s.consensos||[]).map(c=>`<li>${esc(itemTexto(c))}${itemNombres(c).length ? ' — <i>'+itemNombres(c).map(esc).join(', ')+'</i>' : ''}</li>`).join('');
      const propuestas = (s.propuestas||[]).map(p=>`<li>${esc(p.titulo)}</li>`).join('');
      return `<div class="msg panorama"><span class="ptitle">${tr('pChatPanoramaTitulo')}</span>
        <p>${esc(s.resumen||'')}</p>
        ${consensos ? '<b>'+tr('pChatConsensos')+'</b><ul>'+consensos+'</ul>' : ''}
        ${propuestas ? '<b>'+tr('pChatPropuestas')+'</b><ul>'+propuestas+'</ul>' : ''}

      return `<div class="msg panorama"><span class="ptitle">${tr('pChatPanoramaTitulo')}</span><p class="empty">${tr('pChatPanoramaCorrupto')}</p></div>`;
    }
  }
  return `<div class="msg ${m.role === 'user' ? 'user' : 'ai'}">${esc(m.content)}</div>`;
}

function conectarVotosEncuesta(){
  document.querySelectorAll('.encuesta-opcion').forEach(b => b.onclick = async () => {
    const i = parseInt(b.dataset.i, 10);
    const enc = state.temaActual.encuesta;
    let nuevo;
    if(enc.multiple){
      nuevo = state.miVoto.includes(i) ? state.miVoto.filter(x => x !== i) : [...state.miVoto, i];
    } else {
      nuevo = (state.miVoto.length === 1 && state.miVoto[0] === i) ? [] : [i];
    }
    if(nuevo.length === 0) return; // por ahora no se puede dejar la encuesta sin ningún voto
    state.miVoto = nuevo;
    await apiPost('/grupos/' + state.workspaceId + '/temas/' + state.temaActual.id + '/votos', { participanteId: state.participantId, opciones: nuevo });
    const res = await apiGet('/grupos/' + state.workspaceId + '/temas/' + state.temaActual.id + '/votos/resultados');
    state.encuestaResultados = (res && !res.error) ? res : state.encuestaResultados;
    render();
  });
}

function renderEncuestaWidget(){
  const t = state.temaActual;
  if(!t.encuesta) return '';
  const enc = encuestaTraducida(t);
  const res = state.encuestaResultados || { counts: enc.opciones.map(()=>0), totalVotantes: 0 };
  const misVotos = state.miVoto || [];
  const opcionesHtml = enc.opciones.map((op, i) => {
    const votos = res.counts[i] || 0;
    const pct = res.totalVotantes ? Math.round(votos / res.totalVotantes * 100) : 0;
    const marcado = misVotos.includes(i);
    return `
      <button class="encuesta-opcion ${marcado ? 'marcada':''}" data-i="${i}">
        <span class="eo-bar" style="width:${pct}%"></span>
        <span class="eo-check">${marcado ? '✓' : ''}</span>
        <span class="eo-texto">${esc(op)}</span>
        <span class="eo-pct">${pct}% · ${votos}</span>
      </button>`;
  }).join('');
  return `
    <div class="card encuesta-card">
      <p class="eyebrow" style="margin-bottom:6px;">${I18N.encuestaEyebrow[state.lang]}${enc.multiple ? I18N.encuestaMultiple[state.lang] : I18N.encuestaUnica[state.lang]}</p>
      <h4 style="font-family:'Fraunces',serif; margin:0 0 12px; font-size:17px; color:var(--ink);">${esc(enc.pregunta)}</h4>
      ${opcionesHtml}
      <p class="footer-note" style="margin-top:10px;">${personasVotaron(res.totalVotantes, 'hasta ahora', 'so far')}${I18N.encuestaCambiarRespuesta[state.lang]}</p>
    </div>`;
}

        <option value="creacion" ${state.ordenTemas==='creacion' ? 'selected':''}>${tr('ordenCreacion')}</option>
        <option value="participantes" ${state.ordenTemas==='participantes' ? 'selected':''}>${tr('ordenParticipantes')}</option>
      </select>
    </div>
    <div>${publicadosVisibles.length ? publicadosVisibles.map(itemHtml).join('') : `<p class="empty">${tr('modSinPublicados')}</p>`}</div>
    ${publicados.length > limitePublicados ? `<button class="btn btn-ghost btn-sm" id="ver-mas-publicados">${tr('verMas')} (${publicados.length - limitePublicados})</button>` : ''}
    ${terminados.length ? `<hr class="divider" /><p class="eyebrow">${tr('modHistorial')}</p>` + terminadosVisibles.map(itemHtml).join('') + (terminados.length > limiteTerminados ? `<button class="btn btn-ghost btn-sm" id="ver-mas-terminados">${tr('verMas')} (${terminados.length - limiteTerminados})</button>` : '') : ''}
    <hr class="divider" />
    <button class="btn btn-danger" id="borrar-grupo">${tr('modGruposBorrarEsteGrupo')}</button>
  `;
  asegurarTraduccionesTemas([...publicadosVisibles, ...terminadosVisibles]);
  const verMasPubBtn = document.getElementById('ver-mas-publicados');
  if(verMasPubBtn) verMasPubBtn.onclick = () => { state.mostrarPublicadosHasta = limitePublicados + 20; render(); };
  const verMasTermBtn = document.getElementById('ver-mas-terminados');
  if(verMasTermBtn) verMasTermBtn.onclick = () => { state.mostrarTerminadosHasta = limiteTerminados + 20; render(); };
  document.getElementById('back').onclick = () => { state.view='role'; render(); };
  document.getElementById('nuevo-tema').onclick = () => { state.view='mod-new-tema'; render(); };
  document.getElementById('ajuste-crear').onchange = async (e) => {
    state.workspaceMeta.permitirCrearTemas = e.target.checked;
    await apiPost('/grupos/' + state.workspaceId + '/ajustes', { permitirCrearTemas: e.target.checked, pin: state.moderatorPin });
  };
  document.getElementById('ajuste-aprobar').onchange = async (e) => {
    state.workspaceMeta.requiereAprobacion = e.target.checked;
    await apiPost('/grupos/' + state.workspaceId + '/ajustes', { requiereAprobacion: e.target.checked, pin: state.moderatorPin });
  };
  document.getElementById('ajuste-publico').onchange = async (e) => {
    state.workspaceMeta.publico = e.target.checked;
    await apiPost('/grupos/' + state.workspaceId + '/ajustes', { publico: e.target.checked, pin: state.moderatorPin });
  };
  document.getElementById('ajuste-registro').onchange = async (e) => {
    state.workspaceMeta.requiereRegistro = e.target.checked;
    await apiPost('/grupos/' + state.workspaceId + '/ajustes', { requiereRegistro: e.target.checked, pin: state.moderatorPin });
  };
  document.getElementById('guardar-pin-acceso').onclick = async () => {
    const v = document.getElementById('nuevo-pin-acceso').value.trim();
    const msg = document.getElementById('pin-acceso-msg');
    if(!v){ msg.textContent = tr('modPinAccesoFalta'); return; }
    const resultado = await apiPost('/grupos/' + state.workspaceId + '/pin-acceso', { pinAcceso: v, pin: state.moderatorPin });
    state.workspaceMeta.tienePinAcceso = !!(resultado && resultado.tienePinAcceso);
    render();
  };
  armarConfirmacionDobleToque(document.getElementById('quitar-pin-acceso'), async () => {
    await apiPost('/grupos/' + state.workspaceId + '/pin-acceso', { pinAcceso: '', pin: state.moderatorPin });
    state.workspaceMeta.tienePinAcceso = false;
    render();
  });
  document.getElementById('orden-tema').addEventListener('change', (e) => { state.ordenTemas = e.target.value; state.mostrarPublicadosHasta = null; state.mostrarTerminadosHasta = null; render(); });
  document.querySelectorAll('.tema-abrir').forEach(b => b.onclick = async () => {
    state.temaActual = state.temas.find(t => t.id === b.dataset.id);
    state.editingTema = false;
    state.error = '';
    const sRaw = await apiPost('/grupos/' + state.workspaceId + '/temas/' + state.temaActual.id + '/sintesis/traducir', { idioma: state.lang });
    state.synth = (sRaw && !sRaw.error) ? sRaw : null;
    if(state.temaActual.encuesta){
      const res = await apiGet('/grupos/' + state.workspaceId + '/temas/' + state.temaActual.id + '/votos/resultados');
      state.encuestaResultados = (res && !res.error) ? res : { counts: state.temaActual.encuesta.opciones.map(()=>0), totalVotantes: 0 };
    } else state.encuestaResultados = null;
    state.view = 'mod-tema'; render();
  });
  document.querySelectorAll('.aprobar-tema').forEach(b => b.onclick = async () => {
    await patchTema(b.dataset.id, { aprobado: true });
    render();
  });
  document.querySelectorAll('.rechazar-tema').forEach(b => {
    armarConfirmacionDobleToque(b, async () => {
      await eliminarTemaBackend(b.dataset.id);
      render();
    });
  });
  armarConfirmacionDobleToque(document.getElementById('borrar-grupo'), async () => {
    const resultado = await apiPost('/grupos/' + state.workspaceId + '/eliminar', { pin: state.moderatorPin || '' });
    if(!resultado || resultado.error){
      alert(tr('pinIncorrecto'));
      return;
    }
    let recientes = [];
    try{
      const r = await rawStorageGet('mis-grupos-recientes', false);
      if(r) recientes = JSON.parse(r.value);
    }catch(e){}
    recientes = recientes.filter(g => g.codigo !== state.workspaceId);
    await rawStorageSet('mis-grupos-recientes', JSON.stringify(recientes), false);
    location.hash = '';
    state.workspaceId = null;
    state.workspaceMeta = null;
    state.moderatorPin = null;
    state.view = 'landing';
    render();
  });
}

      agregarOpcionInput(); agregarOpcionInput();

      let encuesta = null;
      if(document.getElementById('tiene-encuesta').checked){
        const pregunta = document.getElementById('encuesta-pregunta').value.trim();
        const opciones = Array.from(document.querySelectorAll('.opcion-encuesta')).map(i => i.value.trim()).filter(Boolean);
        if(!pregunta || opciones.length < 2){ document.getElementById('edit-err').textContent = I18N.modNewTemaFaltaEncuesta[state.lang]; return; }
        encuesta = { pregunta, opciones, multiple: document.getElementById('encuesta-multiple').checked };
      }
      const actualizado = await patchTema(t.id, { titulo, descripcion, encuesta });
      if(actualizado) state.temaActual = actualizado;
      state.editingTema = false; render();

  document.getElementById('gen-synth').onclick = async () => {
    state.busy = true; state.error=''; render();
    const presupuestoAprox = 12000;
    const s = await streamPost('/grupos/' + state.workspaceId + '/temas/' + t.id + '/sintesis', (chars) => {
      actualizarBarraProgreso('progreso-synth-mod', (chars / presupuestoAprox) * 100);

    descargarWordBlob(html, nombre, 'mod-ok', 'mod-err');

  if(activar) activar.onclick = () => aplicarPatch({ estado: 'activo' });
  const terminar = document.getElementById('terminar');

  document.getElementById('fijar').onclick = () => aplicarPatch({ fijado: !t.fijado });
  document.getElementById('editar').onclick = () => { state.editingTema = true; render(); };
  armarConfirmacionDobleToque(document.getElementById('eliminar'), async () => {
    await eliminarTemaBackend(t.id);
    state.view = 'moderator'; render();
  });
}

function itemTexto(c){ return typeof c === 'string' ? c : (c.texto || ''); }
function itemNombres(c){ return typeof c === 'string' ? [] : (c.participantes || []); }

function renderEncuestaResultadosBloque(){
  const t = state.temaActual;
  if(!t.encuesta) return '';
  const enc = encuestaTraducida(t);
  const res = state.encuestaResultados || { counts: enc.opciones.map(()=>0), totalVotantes: 0 };
  const opcionesHtml = enc.opciones.map((op, i) => {
    const votos = res.counts[i] || 0;
    const pct = res.totalVotantes ? Math.round(votos / res.totalVotantes * 100) : 0;
    return `
      <div class="encuesta-opcion" style="cursor:default;">
        <span class="eo-bar" style="width:${pct}%"></span>
        <span class="eo-texto">${esc(op)}</span>
        <span class="eo-pct">${pct}% · ${votos}</span>
      </div>`;
  }).join('');
  return `
    <div class="card encuesta-card">
      <p class="eyebrow" style="margin-bottom:6px;">${I18N.encuestaResultadosEyebrow[state.lang]}</p>
      <h4 style="font-family:'Fraunces',serif; margin:0 0 12px; font-size:17px; color:var(--ink);">${esc(enc.pregunta)}</h4>
      ${opcionesHtml}
      <p class="footer-note" style="margin-top:10px;">${personasVotaron(res.totalVotantes)}</p>
    </div>`;
}

function renderSynthesis(){
  if(!state.synth) return `<p class="empty">${I18N.synthSinSintesis[state.lang]}</p>`;
  const s = state.synth;
  const consensos = (s.consensos||[]).map(c => `<li>${esc(itemTexto(c))}${itemNombres(c).length ? ' <span class="names">— ' + itemNombres(c).map(esc).join(', ') + '</span>' : ''}</li>`).join('');
  const matices = (s.matices||[]).map(c => `<li>${esc(itemTexto(c))}${itemNombres(c).length ? ' <span class="names">— ' + itemNombres(c).map(esc).join(', ') + '</span>' : ''}</li>`).join('');
  const propuestas = (s.propuestas||[]).map(p => `
    <div class="proposal">
      <div class="t">${esc(p.titulo||'')}</div>
      <div>${esc(p.descripcion||'')}</div>
      <div class="names">${(p.participantes||[]).map(esc).join(' · ')}</div>
    </div>`).join('');
  const pasosHtml = (s.pasos||[]).length ? `
    <div class="synth-block">
      <h3>${I18N.synthPlanAccion[state.lang]}</h3>
      ${(s.pasos||[]).map((p,i) => `<div class="step"><span class="step-n">${i+1}</span><p>${esc(p)}</p></div>`).join('')}
    </div>` : '';
  const comparacionHtml = (s.comparacion||[]).length >= 2 ? `
    <div class="synth-block">
      <h3>${I18N.synthPosturasEnfrentadas[state.lang]}</h3>
      <div class="cmp-wrap"><table class="cmp-table">
        <tr><th></th>${s.comparacion.map(c => `<th>${esc(c.titulo||'')}</th>`).join('')}</tr>
        <tr><td>${I18N.synthPostura[state.lang]}</td>${s.comparacion.map(c => `<td>${esc(c.descripcion||'')}</td>`).join('')}</tr>
        <tr><td>${I18N.synthSostenidaPor[state.lang]}</td>${s.comparacion.map(c => `<td class="names">${(c.participantes||[]).map(esc).join(', ')}</td>`).join('')}</tr>
      </table></div>
    </div>` : '';
  return `
    <div class="synth-block"><h3>${I18N.resumen[state.lang]}</h3><p>${esc(s.resumen||'')}</p></div>
    <div class="synth-block"><h3>${I18N.synthConsensos[state.lang]}</h3><ul>${consensos || `<li class="empty">${I18N.synthSinDatosTodavia[state.lang]}</li>`}</ul></div>
    <div class="synth-block"><h3>${I18N.synthMaticesDesacuerdos[state.lang]}</h3><ul>${matices || `<li class="empty">${I18N.synthSinDatosTodavia[state.lang]}</li>`}</ul></div>
    ${comparacionHtml}
    <div class="synth-block"><h3>${I18N.synthPropuestas[state.lang]}</h3>${propuestas || `<p class="empty">${I18N.synthSinDatosTodavia[state.lang]}</p>`}</div>
    ${pasosHtml}
  `;
}

async function boot(){
  try{
    const langR = await rawStorageGet('idioma-preferido', false);
    if(langR && (langR.value === 'es' || langR.value === 'en')) state.lang = langR.value;
  }catch(e){}
  document.documentElement.lang = state.lang;
  document.title = tr('docTitle');
  pintarLangSwitch();

  // Si venimos de vuelta del login con Google, el backend nos manda el token acá por la URL.
  const paramsUrl = new URLSearchParams(location.search);
  const authToken = paramsUrl.get('authToken');
  const authState = paramsUrl.get('authState');
  const authError = paramsUrl.get('authError');
  if(authToken || authError){
    let esperado = '', hashPrevio = '';
    try{
      esperado = sessionStorage.getItem('deliberia-auth-state') || '';
      hashPrevio = sessionStorage.getItem('deliberia-auth-return-hash') || '';
      sessionStorage.removeItem('deliberia-auth-state');
      sessionStorage.removeItem('deliberia-auth-return-hash');
    }catch(e){}
    if(authToken && authState && authState === esperado){
      await rawStorageSet('auth-token', authToken, false);
    } else if(authError){
      state.errorLanding = tr('googleErrorLogin');
    }
    history.replaceState(null, '', location.pathname + hashPrevio);
  }

  const tokenR = await rawStorageGet('auth-token', false);
  if(tokenR && tokenR.value){
    try{
      const info = await fetch(API_BASE + '/auth/me?token=' + encodeURIComponent(tokenR.value)).then(r => r.json());
      if(info && !info.error){ state.authToken = tokenR.value; state.authUserInfo = info; }
      else { await rawStorageDelete('auth-token', false); }
    }catch(e){}
  }

  const codigo = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
  if(codigo){
    const meta = await apiGet('/grupos/' + encodeURIComponent(codigo));
    if(meta && !meta.error){
      state.workspaceId = codigo;
      state.workspaceMeta = meta;
      state.view = 'role';
    } else {
      state.errorLanding = tr('landNoEncontramosLink');
      state.view = 'landing';
    }
  } else {
    state.view = 'landing';
  }
  render();
}
boot();
</script>
</body>
</html>
